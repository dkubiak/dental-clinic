replicaCount: 2 # ≥2 replicas across AZs behind the ALB (plan.md Risk Tier & Availability)

image:
  repository: REPLACE_WITH_ECR_REPO_URL
  tag: "0.1.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: patient-service
  # Populated by CI from Terraform IRSA output, if/when this service needs direct AWS access
  # (plan.md Constitution Check, Principle VI) — none is needed at this stage.
  eksRoleArn: ""

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

env:
  DB_URL: ""

# Argo Rollouts canary steps (Environments & Release Process) — applied via the Rollout resource
# once Argo Rollouts is wired in for this service; left disabled until then, mirroring
# helm/auth-service/values.yaml.
rollout:
  enabled: false
  canarySteps:
    - setWeight: 10
    - pause: { duration: "5m" }
    - setWeight: 50
    - pause: { duration: "5m" }
    - setWeight: 100
