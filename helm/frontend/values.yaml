replicaCount: 2

image:
  repository: REPLACE_WITH_ECR_REPO_URL
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

rollout:
  enabled: false
  canarySteps:
    - setWeight: 10
    - pause: { duration: "5m" }
    - setWeight: 50
    - pause: { duration: "5m" }
    - setWeight: 100
