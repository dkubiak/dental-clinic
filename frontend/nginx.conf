server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /patients/{id} is requested twice for the exact same URL in quick succession — once as a
    # full-page navigation (Accept: text/html, served as the SPA's index.html) and once as
    # Angular's own data-fetch XHR for that same route (Accept: application/json, proxied to
    # patient-service) — see the /patients location below. Without declaring that the response
    # varies by Accept, the browser's HTTP cache can reuse the cached index.html response for the
    # second (XHR) request instead of re-requesting it, silently handing Angular an HTML page
    # instead of JSON (T063 finding — surfaced only by a direct deep-link immediately followed by
    # the component's own fetch, e.g. a role switch via page.goto() straight to a detail URL).
    add_header Vary Accept always;

    # Mirrors proxy.conf.js's routes (dev-server only) for the containerized build — forwards
    # the backend API paths to the auth-service compose service, everything else is the SPA.
    location /auth/ {
        proxy_pass http://auth-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No trailing slash: AccountController/AuditLogController map the bare paths themselves
    # (`/accounts`, `/audit-log`), not `/accounts/...`. A trailing-slash location here doesn't
    # match those bare requests, so nginx falls through to the SPA location and 301-redirects
    # them to a self-referential URL that the frontend's XHR calls can't follow.
    location /accounts {
        proxy_pass http://auth-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /audit-log {
        proxy_pass http://auth-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 002-patient-records — PatientController et al. map bare `/patients` paths themselves, same
    # reasoning as /accounts and /audit-log above (no trailing slash).
    #
    # Unlike /accounts and /audit-log, `/patients` is ALSO an Angular client-side route
    # (patient-search/-create/-detail, app.routes.ts) at the exact same paths the API uses
    # (e.g. GET /patients/{id} is both the detail-fetch XHR and a full-page reload of that
    # route) — so this location can't unconditionally proxy everything under /patients the way
    # the /accounts and /audit-log blocks do. Browsers send `Accept: text/html...` on a
    # top-level navigation (typed URL, link click, deep link, page reload); Angular's
    # HttpClient does not — so a request whose Accept header doesn't mention text/html is
    # reliably a real API call, not a page load, and only those go to patient-service.
    location /patients {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://patient-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
