spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dental_clinic_auth}
    username: ${DB_USERNAME:auth_service_app}
    password: ${DB_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # Deliberately a separate credential from spring.datasource: V5__audit_log.sql is what CREATEs
    # the auth_service_app role that spring.datasource.username defaults to, so Flyway (which must
    # run V1 first) cannot authenticate as that role yet on a fresh database — it needs a
    # pre-existing owner/admin credential. In RDS/Aurora this is the Terraform-provisioned master
    # user (out-of-band, matching V5's comment); locally/in Testcontainers it is the same
    # credential as spring.datasource unless overridden (see support/PostgresIntegrationTestBase).
    url: ${FLYWAY_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/dental_clinic_auth}}
    user: ${FLYWAY_DB_USERNAME:${DB_USERNAME:auth_service_app}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD:}}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never # schema owned by Flyway (T017 — V3__session.sql)
    timeout: 15m # idle timeout (FR-012, spec Assumptions)

server:
  port: ${SERVER_PORT:8080}

# Application-specific configuration (bound by SecurityConfig/SessionConfig/MfaService — see
# T026/T027/T042). Values here are non-secret defaults; secrets come from env vars / AWS Secrets
# Manager at deploy time, never committed.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  session:
    idle-timeout: 15m # FR-012
    hard-cap: 8h # FR-012, spec Assumptions — absolute cap regardless of activity
  account-lockout:
    max-failed-attempts: 5 # FR-011, spec Assumptions
    lockout-duration: 15m
  ip-rate-limit:
    max-attempts-per-window: ${IP_RATE_LIMIT_MAX_ATTEMPTS:20} # FR-011b — per-IP, across all accounts
    window-duration: 1m
  password-reset:
    token-validity: 30m # FR-016, spec Assumptions
    frontend-reset-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:4200/password-reset/confirm}
  security:
    # HMAC signing key for the stateless pre-auth token (FR-015a, PreAuthTokenService) — a real
    # secret MUST be supplied via env var in every deployed environment; this default exists only
    # so local `./gradlew bootRun` / tests don't require one to be set.
    pre-auth-token-secret: ${PRE_AUTH_TOKEN_SECRET:dev-only-insecure-default-secret-change-me}
  kms:
    mfa-secret-key-id: ${MFA_SECRET_KMS_KEY_ID:} # populated from Terraform output (T009a)
  ses:
    from-address: ${SES_FROM_ADDRESS:no-reply@dentalclinic.example}
  retention:
    # FR-018 — AuditLogRetentionJob (T085a). Runs under a separate, more-privileged DB role
    # (auth_service_retention, V8__audit_log_retention_role.sql) than the application's normal
    # auth_service_app, which has DELETE revoked on audit_log_entry (FR-008).
    max-age: 1095d # 3 years
    cron: ${AUDIT_LOG_RETENTION_CRON:0 0 3 * * *} # daily at 03:00
    db:
      url: ${AUDIT_RETENTION_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/dental_clinic_auth}}
      username: ${AUDIT_RETENTION_DB_USERNAME:auth_service_retention}
      password: ${AUDIT_RETENTION_DB_PASSWORD:}
  e2e-seed:
    # Only read when spring.profiles.active includes e2e-seed (E2eSeedRunner/E2eStubAwsConfig) —
    # defaults assume the standard monorepo layout (backend/, frontend/ siblings) and
    # `./gradlew bootRun` run from backend/, so both files land where the Playwright suite
    # (frontend/e2e/support) expects them.
    output-path: ${E2E_SEED_OUTPUT_PATH:../frontend/e2e/.generated/seed-accounts.json}
    captured-emails-path: ${E2E_SEED_EMAILS_PATH:../frontend/e2e/.generated/sent-emails.jsonl}

logging:
  level:
    com.dentalclinic.auth: INFO
