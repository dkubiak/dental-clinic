spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dental_clinic_auth}
    username: ${DB_USERNAME:auth_service_app}
    password: ${DB_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never # schema owned by Flyway (T017 — V3__session.sql)
    timeout: 15m # idle timeout (FR-012, spec Assumptions)

server:
  port: ${SERVER_PORT:8080}

# Application-specific configuration (bound by SecurityConfig/SessionConfig/MfaService — see
# T026/T027/T042). Values here are non-secret defaults; secrets come from env vars / AWS Secrets
# Manager at deploy time, never committed.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  session:
    idle-timeout: 15m # FR-012
    hard-cap: 8h # FR-012, spec Assumptions — absolute cap regardless of activity
  account-lockout:
    max-failed-attempts: 5 # FR-011, spec Assumptions
    lockout-duration: 15m
  password-reset:
    token-validity: 30m # FR-016, spec Assumptions
  kms:
    mfa-secret-key-id: ${MFA_SECRET_KMS_KEY_ID:} # populated from Terraform output (T009a)
  ses:
    from-address: ${SES_FROM_ADDRESS:no-reply@dentalclinic.example}

logging:
  level:
    com.dentalclinic.auth: INFO
