name: CI

# Runs on every PR (Development Workflow gate — CI must pass before merge, Principle VI).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (JUnit 5 + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build & test
        working-directory: backend
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests

  patient-service:
    name: Patient Service (JUnit 5 + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build & test
        working-directory: patient-service
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patient-service-test-reports
          path: patient-service/build/reports/tests

  frontend-unit:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

  frontend-e2e-theme:
    name: Frontend (Playwright, theme — no backend needed)
    runs-on: ubuntu-latest
    needs: [frontend-unit]
    # US2 (theme toggle) and US5 (320px/zoom on pre-auth screens) run entirely against the static
    # build — the toggle must work before authentication (FR-008), so unlike frontend-e2e below,
    # this job needs no Postgres/LocalStack (research.md R6, quickstart.md §4). Authenticated
    # screens (kartoteka, konta, log audytowy) are covered by manual verification with the real
    # backend, not this job — see quickstart.md §3.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Build app
        working-directory: frontend
        run: npm run build

      - name: Serve build
        working-directory: frontend
        run: |
          npm run serve:dist &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4200 > /dev/null && exit 0
            sleep 1
          done
          echo "static server did not become ready" >&2
          exit 1

      - name: Run theme e2e specs
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:4200
        run: npx playwright test e2e/us2-theme-toggle.spec.ts e2e/us5-theme-contrast.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-theme
          path: frontend/playwright-report

  frontend-e2e:
    name: Frontend (Playwright, mobile-first)
    runs-on: ubuntu-latest
    needs: [backend, patient-service, frontend-unit]
    # Skipped for now: these specs need a running backend (Postgres + LocalStack KMS,
    # `-Dspring.profiles.active=e2e-seed` per e2e/us1-login-rbac.spec.ts and quickstart.md
    # Prerequisites) and a served frontend build, neither of which this job sets up yet.
    # TODO: wire up those services/steps, then drop this `if:` to re-enable the job.
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Build app
        working-directory: frontend
        run: npm run build

      - name: Run e2e (US1–US3 acceptance scenarios)
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
