<title>Karta uzębienia Projekt Uśmiech</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ── Tokeny: lustrzane wobec design/brand/_pu-tokens.scss ───────────────── */
:root {
  --bg: #FAF7F2;
  --surface: #FFFFFF;
  --surface-raised: #F2EDE6;
  --border: #E6DFD5;
  --border-strong: #7D746F;
  --text: #1F1D1E;
  --text-muted: #5C5654;
  --text-disabled: #8C8480;
  --accent: #CBAD89;
  --accent-text: #7A5A2E;
  --accent-hover: #B2946E;
  --on-accent: #1F1D1E;
  --euc: #3E7A72;
  --euc-text: #2F5D57;
  --euc-wash: #D7E8E4;
  --success: #2E6B45;
  --success-wash: #DCEBE1;
  --warning: #9A5B00;
  --warning-wash: #F7E9D2;
  --error: #A33A32;
  --error-wash: #F7E3E1;
  --info: #3B5A7A;
  --focus-ring: #7A5A2E;

  --tooth-fill: #FFFFFF;
  --tooth-stroke: #5C5654;
  --tooth-root-fill: #F2EDE6;
  --tooth-diseased-fill: #F7E3E1;
  --tooth-diseased-stroke: #A33A32;
  --tooth-restored-fill: #D7E8E4;
  --tooth-restored-stroke: #3E7A72;
  --tooth-closed-stroke: #2E6B45;
  --tooth-selected-stroke: #7A5A2E;
  --tooth-absent: #8C8480;
  --canal-treat: #A33A32;
  --canal-done: #2E6B45;

  --shadow-sm: 0 1px 2px rgb(31 29 30 / .07), 0 1px 1px rgb(31 29 30 / .04);
  --shadow-md: 0 6px 22px rgb(31 29 30 / .10), 0 2px 6px rgb(31 29 30 / .06);
  --radius: 10px;
  --radius-sm: 6px;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1819; --surface: #2E2C2D; --surface-raised: #363233;
    --border: #504C4B; --border-strong: #8C8480;
    --text: #EAE4DC; --text-muted: #A79E96; --text-disabled: #7A726C;
    --accent: #CBAD89; --accent-text: #E3C9A6; --accent-hover: #E3C9A6; --on-accent: #1A1819;
    --euc: #7FB3AA; --euc-text: #7FB3AA; --euc-wash: #24413E;
    --success: #6FBF8E; --success-wash: #223D2C;
    --warning: #E8A33D; --warning-wash: #4A3413;
    --error: #E88178; --error-wash: #5A2B27;
    --info: #8FB2D6; --focus-ring: #E3C9A6;
    --tooth-fill: #363233; --tooth-stroke: #A79E96; --tooth-root-fill: #2E2C2D;
    --tooth-diseased-fill: #5A2B27; --tooth-diseased-stroke: #E88178;
    --tooth-restored-fill: #24413E; --tooth-restored-stroke: #7FB3AA;
    --tooth-closed-stroke: #6FBF8E; --tooth-selected-stroke: #E3C9A6; --tooth-absent: #7A726C;
    --canal-treat: #E88178; --canal-done: #6FBF8E;
    --shadow-sm: 0 1px 2px rgb(0 0 0 / .4);
    --shadow-md: 0 8px 26px rgb(0 0 0 / .45), 0 2px 6px rgb(0 0 0 / .3);
  }
}
:root[data-theme="dark"] {
  --bg: #1A1819; --surface: #2E2C2D; --surface-raised: #363233;
  --border: #504C4B; --border-strong: #8C8480;
  --text: #EAE4DC; --text-muted: #A79E96; --text-disabled: #7A726C;
  --accent: #CBAD89; --accent-text: #E3C9A6; --accent-hover: #E3C9A6; --on-accent: #1A1819;
  --euc: #7FB3AA; --euc-text: #7FB3AA; --euc-wash: #24413E;
  --success: #6FBF8E; --success-wash: #223D2C;
  --warning: #E8A33D; --warning-wash: #4A3413;
  --error: #E88178; --error-wash: #5A2B27;
  --info: #8FB2D6; --focus-ring: #E3C9A6;
  --tooth-fill: #363233; --tooth-stroke: #A79E96; --tooth-root-fill: #2E2C2D;
  --tooth-diseased-fill: #5A2B27; --tooth-diseased-stroke: #E88178;
  --tooth-restored-fill: #24413E; --tooth-restored-stroke: #7FB3AA;
  --tooth-closed-stroke: #6FBF8E; --tooth-selected-stroke: #E3C9A6; --tooth-absent: #7A726C;
  --canal-treat: #E88178; --canal-done: #6FBF8E;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / .4);
  --shadow-md: 0 8px 26px rgb(0 0 0 / .45), 0 2px 6px rgb(0 0 0 / .3);
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.012em; }

.app { min-height: 100vh; display: flex; flex-direction: column; overflow-x: clip; }
.topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 16px;
  background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 30; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; }
.brand b { display: block; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.brand span { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .09em; }
.patient { display: flex; align-items: baseline; gap: 10px 12px; flex-wrap: wrap; min-width: 0; }
.patient-name { font-weight: 600; }
.patient-meta { font-family: var(--mono); font-size: 12px; color: var(--text-muted); }
.alert-chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px;
  background: var(--error-wash); color: var(--error); border: 1px solid var(--error); font-size: 12px; font-weight: 600; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface-raised); border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: none; cursor: pointer; border-radius: 999px; padding: 5px 11px; font-size: 13px; color: var(--text-muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.icon-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--text-muted); }
.icon-btn:hover { border-color: var(--border-strong); color: var(--text); }
.icon-btn[aria-pressed="true"] { background: var(--surface-raised); color: var(--accent-text); border-color: var(--accent); }

.workspace { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 16px; align-items: start; flex: 1; min-width: 0; }
.workspace > * { min-width: 0; }
@media (min-width: 1260px) { .workspace { grid-template-columns: minmax(0, 1fr) 400px; padding: 20px; gap: 20px; } }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); min-width: 0; }
.panel-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.panel-head h2 { font-size: 15px; font-weight: 600; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--text-muted); }
.chip[aria-pressed="true"] { background: var(--surface-raised); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }

.selbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 16px;
  border-bottom: 1px solid var(--border); background: var(--surface-raised); }
.selbar .count { font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border); font-variant-numeric: tabular-nums; }
.selbar .count.on { border-color: var(--accent); color: var(--accent-text); }
.quick { display: flex; gap: 4px; flex-wrap: wrap; }
.quick button { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-sm);
  padding: 4px 9px; font-size: 12px; cursor: pointer; color: var(--text-muted); white-space: nowrap; }
.quick button:hover { border-color: var(--accent); color: var(--accent-text); }
.selbar .spacer { margin-left: auto; }

/* ── Diagram ─────────────────────────────────────────────────────────────── */
.arch-wrap { overflow-x: auto; overscroll-behavior-x: contain; padding: 4px 12px 12px; }
.arch { display: block; min-width: 780px; width: 100%; height: auto; touch-action: pan-x pan-y; }

.tooth { cursor: pointer; }
.tooth .root { fill: var(--tooth-root-fill); stroke: var(--tooth-stroke); stroke-width: 1.1; }
.tooth .crown { fill: var(--tooth-fill); stroke: var(--tooth-stroke); stroke-width: 1.3; }
.tooth .hit { fill: transparent; }
.tooth:hover .crown { stroke: var(--accent-hover); }
.tooth.is-diseased .crown { fill: var(--tooth-diseased-fill); stroke: var(--tooth-diseased-stroke); }
.tooth.is-restored .crown { fill: var(--tooth-restored-fill); stroke: var(--tooth-restored-stroke); }
.tooth.is-absent .crown, .tooth.is-absent .root { fill: none; stroke: var(--tooth-absent); stroke-dasharray: 3 3; }
.tooth.is-absent .canal { display: none; }
.tooth.is-unerupted .crown, .tooth.is-unerupted .root { opacity: .45; stroke-dasharray: 4 3; }
.tooth.is-selected .crown { stroke: var(--tooth-selected-stroke); stroke-width: 2.4; }
.tooth.is-selected .root { stroke: var(--tooth-selected-stroke); }
.absent-cross { display: none; }
.absent-cross path { stroke: var(--tooth-absent); stroke-width: 1.6; stroke-linecap: round; fill: none; }
.tooth.is-absent .absent-cross { display: block; }

/* kanały — wyraźne, trzy stany (FR-066a) */
.canal { fill: none; stroke-linecap: round; stroke-width: 3.4; }
.canal.c-treat { stroke: var(--canal-treat); stroke-dasharray: 5 3.4; }
.canal.c-done { stroke: var(--canal-done); }
.canal.c-under-body { stroke: var(--canal-done); }
.canal.c-under-apex { stroke: var(--canal-treat); }
.canal-apex-dot { fill: var(--canal-treat); }

.tooth-label { font-family: var(--mono); font-size: 11px; font-weight: 600; fill: var(--text-muted);
  text-anchor: middle; font-variant-numeric: tabular-nums; pointer-events: none; user-select: none; }
.tooth-label.is-sel { fill: var(--accent-text); font-weight: 700; }
.midline { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 4; }
.quad-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  fill: var(--text-disabled); text-anchor: middle; pointer-events: none; }

/* schemat powierzchni w środkowym pasie (FR-029) */
.sbox .frame { fill: none; stroke: var(--border-strong); stroke-width: 1.1; }
.sbox .zone { fill: var(--tooth-fill); stroke: var(--tooth-stroke); stroke-width: .8; cursor: pointer; }
.sbox .zone:hover { fill: var(--surface-raised); }
.sbox .zone.f-diag { fill: url(#hatchDiag); stroke: var(--tooth-diseased-stroke); stroke-width: 1.1; }
.sbox .zone.f-rest { fill: var(--tooth-restored-stroke); stroke: var(--tooth-restored-stroke); }
.sbox .zone.f-done { fill: var(--tooth-fill); stroke: var(--tooth-closed-stroke); stroke-width: 1.6; }
.sbox .zone.picked { stroke: var(--tooth-selected-stroke); stroke-width: 2.2; }
.sbox.is-selected .frame { stroke: var(--tooth-selected-stroke); stroke-width: 2.2; }
.sbox.is-absent .zone { fill: none; stroke: var(--tooth-absent); stroke-dasharray: 2 2; pointer-events: none; }
.sbox.is-absent .frame { stroke: var(--tooth-absent); stroke-dasharray: 3 3; }
@media (pointer: coarse) { .sbox .zone { pointer-events: none; } }
.sbox .boxhit { fill: transparent; cursor: pointer; }

/* ── Przegląd ────────────────────────────────────────────────────────────── */
.overview { border-top: 1px solid var(--border); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.ov-stats { display: flex; gap: 8px; flex-wrap: wrap; }
.ov-stat { display: flex; align-items: baseline; gap: 7px; border: 1px solid var(--border); border-left-width: 3px;
  border-radius: var(--radius-sm); padding: 7px 12px; background: var(--surface-raised); }
.ov-stat b { font-family: var(--mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.ov-stat span { font-size: 12px; color: var(--text-muted); }
.ov-diag { border-left-color: var(--error); }
.ov-rest { border-left-color: var(--euc); }
.ov-absent { border-left-color: var(--text-disabled); }
.ov-canal { border-left-color: var(--success); }
.ov-list { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ov-tooth { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); background: var(--surface);
  border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.ov-tooth b { font-family: var(--mono); font-weight: 600; }
.ov-tooth:hover { border-color: var(--accent); color: var(--accent-text); }
.ov-tooth .dotm { width: 7px; height: 7px; border-radius: 2px; }

.legend { border-top: 1px solid var(--border); }
.legend summary { padding: 10px 16px; cursor: pointer; font-size: 13px; color: var(--text-muted); font-weight: 500; }
.legend summary::marker { color: var(--accent); }
.legend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 16px; padding: 4px 16px 16px; }
.legend-item { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--text-muted); }
.legend-item svg { flex: none; }

/* ── Inspektor ───────────────────────────────────────────────────────────── */
.inspector { display: flex; flex-direction: column; gap: 14px; }
.insp-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.tooth-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.fdi { font-family: var(--mono); font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
.tooth-anat { font-size: 13px; color: var(--text-muted); }
.detail-card { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; }
.detail-card h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
.detail-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }

.surface-map { width: 100%; max-width: 210px; height: auto; display: block; margin: 0 auto; }
.surface-map .sf { cursor: pointer; stroke: var(--tooth-stroke); stroke-width: 1; fill: var(--tooth-fill); }
.surface-map .sf:hover { fill: var(--surface-raised); }
.surface-map .sf.has-diag { fill: url(#hatchDiag2); stroke: var(--tooth-diseased-stroke); }
.surface-map .sf.has-rest { fill: var(--tooth-restored-fill); stroke: var(--tooth-restored-stroke); }
.surface-map .sf.picked { fill: var(--accent); stroke: var(--accent-text); stroke-width: 2; }
.surface-map .sf-label { font-family: var(--mono); font-size: 10px; fill: var(--text-muted); text-anchor: middle; pointer-events: none; font-weight: 600; }

/* kanały w inspektorze */
.canal-empty { display: flex; flex-direction: column; gap: 8px; }
.canal-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.canal-item { display: flex; flex-direction: column; gap: 7px; background: var(--surface);
  border: 1px solid var(--border); border-left-width: 3px; border-radius: var(--radius-sm); padding: 8px 9px; }
.ci-top { display: flex; align-items: flex-start; gap: 8px; }
.ci-bottom { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.canal-item.s-treat { border-left-color: var(--canal-treat); }
.canal-item.s-done { border-left-color: var(--canal-done); }
.canal-item.s-under { border-left-color: var(--warning); }
.canal-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; }
.canal-name small { display: block; font-weight: 400; color: var(--text-muted); font-size: 11px; }
.state-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
.state-seg button { border: 0; background: var(--surface); cursor: pointer; padding: 4px 9px; font-size: 11.5px; color: var(--text-muted); display: inline-flex; align-items: center; gap: 5px; }
.state-seg button + button { border-left: 1px solid var(--border); }
.state-seg button[aria-pressed="true"] { background: var(--surface-raised); color: var(--text); font-weight: 600; }
.state-dot { width: 9px; height: 9px; border-radius: 999px; flex: none; }
.sd-treat { background: var(--canal-treat); }
.sd-done { background: var(--canal-done); }
.sd-under { background: linear-gradient(180deg, var(--canal-done) 55%, var(--canal-treat) 55%); }
.canal-del { border: 0; background: none; cursor: pointer; color: var(--text-muted); font-size: 15px; line-height: 1; padding: 2px 4px; }
.canal-del:hover { color: var(--error); }
.canal-pick { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 9px; font-size: 11.5px; cursor: pointer; color: var(--text-muted); }
.canal-pick[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; }
.canal-add { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
.field input[type="text"], .field input[type="date"], .field select, .field textarea {
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 8px 10px; width: 100%; }
.field textarea { resize: vertical; min-height: 60px; }
.dx-list { list-style: none; margin: 6px 0 0; padding: 0; max-height: 232px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
.dx-group { padding: 6px 10px 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-muted); background: var(--surface-raised); position: sticky; top: 0; font-weight: 600; }
.dx-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; cursor: pointer; border-bottom: 1px solid var(--border); }
.dx-item:last-child { border-bottom: 0; }
.dx-item:hover { background: var(--surface-raised); }
.dx-item[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.dx-name { flex: 1; font-size: 13px; }
.dx-meta { font-family: var(--mono); font-size: 10.5px; color: var(--text-muted); }
.dx-item[aria-pressed="true"] .dx-meta { color: var(--on-accent); }
.scope-tag { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; padding: 1px 6px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.scope-surface { color: var(--info); } .scope-tooth { color: var(--accent-text); }
.scope-root { color: var(--euc-text); } .scope-perio { color: var(--warning); }
.layer-dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.layer-diag { background: var(--error); } .layer-rest { background: var(--euc); }

.hint { font-size: 12px; color: var(--text-muted); display: flex; gap: 6px; align-items: flex-start; margin: 0; }
.hint.block { color: var(--warning); font-weight: 500; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid transparent; border-radius: var(--radius-sm); padding: 9px 16px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { background: var(--surface-raised); color: var(--text-disabled); cursor: not-allowed; }
.btn-ghost { background: none; border-color: var(--border-strong); color: var(--text-muted); }
.btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }
.btn-sm { padding: 5px 11px; font-size: 12.5px; }

.findings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.finding { border: 1px solid var(--border); border-left: 3px solid var(--error); border-radius: var(--radius-sm); padding: 9px 11px; background: var(--surface); }
.finding.rest { border-left-color: var(--euc); }
.finding.done { border-left-color: var(--success); opacity: .82; }
.finding.stale { border-left-color: var(--text-disabled); opacity: .65; }
.finding-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.finding-name { font-weight: 600; font-size: 13.5px; }
.finding-loc { font-family: var(--mono); font-size: 11.5px; color: var(--accent-text); }
.finding-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }

/* ══ SŁOWNIK ROZPOZNAŃ (FR-011..FR-021) ═══════════════════════════════════ */

  { code:'K05.31', name:'Kieszonka przyzębna',           cat:'perio',  scope:'perio',   layer:'diagnosis', sev:['4–5 mm','6–7 mm','≥8 mm'] },

  { code:'EXTR',   name:'Ząb usunięty (stan po ekstrakcji)', cat:'erupt', scope:'tooth', layer:'existing', presence:'extracted', absentOk:true },
  { code:'FILL',   name:'Wypełnienie',                   cat:'rest', scope:'surface', layer:'existing' },
  { code:'FILLT',  name:'Wypełnienie tymczasowe',        cat:'rest', scope:'surface', layer:'existing' },
  { code:'SEAL',   name:'Uszczelnienie bruzd (lak)',     cat:'rest', scope:'surface', layer:'existing' },
  { code:'ENDO',   name:'Leczenie kanałowe (stan po)',   cat:'rest', scope:'root',   layer:'existing' },
  { code:'POST',   name:'Wkład koronowo-korzeniowy',     cat:'rest', scope:'root',   layer:'existing' },
  { code:'CROWN',  name:'Korona protetyczna',            cat:'rest', scope:'tooth',  layer:'existing' },

  { code:'IMPL',   name:'Implant',                       cat:'rest', scope:'tooth',  layer:'existing', absentOk:true, absentOnly:true },

  { code:'OTHER',  name:'Inne rozpoznanie (wymaga opisu)',cat:'other',scope:'ask',   layer:'diagnosis', needsNote:true },
];
const DXMAP = Object.fromEntries(DX.map(d => [d.code, d]));

/* ══ ANATOMIA ═════════════════════════════════════════════════════════════ */
const PERM_UPPER  = [18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
const PERM_LOWER  = [48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const DEC_UPPER   = [55,54,53,52,51,61,62,63,64,65];
const DEC_LOWER   = [85,84,83,82,81,71,72,73,74,75];
const MIXED_UPPER = [16,55,54,53,12,11,21,22,63,64,65,26];
const MIXED_LOWER = [46,85,84,83,42,41,31,32,73,74,75,36];

const POS_NAME = { 1:'siekacz przyśrodkowy', 2:'siekacz boczny', 3:'kieł',
  4:'pierwszy przedtrzonowiec', 5:'drugi przedtrzonowiec',
  6:'pierwszy trzonowiec', 7:'drugi trzonowiec', 8:'trzeci trzonowiec (ząb mądrości)' };
const POS_NAME_DEC = { 1:'siekacz przyśrodkowy mleczny', 2:'siekacz boczny mleczny', 3:'kieł mleczny',
  4:'pierwszy trzonowiec mleczny', 5:'drugi trzonowiec mleczny' };

function meta(fdi) {
  const q = Math.floor(fdi / 10), p = fdi % 10;
  const deciduous = q >= 5;
  const upper = q === 1 || q === 2 || q === 5 || q === 6;
  const right = q === 1 || q === 4 || q === 5 || q === 8;
  const type = deciduous ? (p <= 2 ? 'incisor' : p === 3 ? 'canine' : 'molar')
                         : (p <= 2 ? 'incisor' : p === 3 ? 'canine' : p <= 5 ? 'premolar' : 'molar');
  const anterior = p <= 3;
  let roots;
  if (deciduous) roots = p <= 3 ? 1 : (upper ? 3 : 2);
  else if (p <= 3) roots = 1;
  else if (p <= 5) roots = (upper && p === 4) ? 2 : 1;
  else roots = upper ? 3 : 2;
  const surfaces = ['M', 'D', 'B', 'L', anterior ? 'I' : 'O'];
  const widths = deciduous
    ? (upper ? { 1:19, 2:17, 3:18, 4:23, 5:25 } : { 1:15, 2:17, 3:18, 4:22, 5:24 })
    : (upper ? { 1:23, 2:19, 3:20, 4:21, 5:21, 6:27, 7:26, 8:24 }
             : { 1:16, 2:17, 3:19, 4:20, 5:21, 6:27, 7:26, 8:24 });
  const name = (deciduous ? POS_NAME_DEC : POS_NAME)[p];
  const quad = (upper ? 'górny ' : 'dolny ') + (right ? 'prawy' : 'lewy');
  return { fdi, q, p, deciduous, upper, right, type, anterior, roots, surfaces,
           name, quad, label: `${name} ${quad}`, width: widths[p] };
}
const SURFACE_NAME = (fdi, s) => {
  const m = meta(fdi);
  return { M:'mezjalna', D:'dystalna', B: m.anterior ? 'wargowa' : 'policzkowa',
    L: m.upper ? 'podniebienna' : 'językowa', O:'żująca', I:'sieczna' }[s];
};
/* podpowiedź anatomiczna — NIE jest zapisywana jako dane pacjenta (FR-064) */
function suggestedCanals(fdi) {
  const m = meta(fdi);
  if (m.type === 'incisor' || m.type === 'canine') return ['kanał główny'];
  if (m.type === 'premolar') return m.upper && m.p === 4 ? ['policzkowy', 'podniebienny'] : ['kanał główny'];
  if (m.deciduous) return m.upper ? ['policzkowy bliższy', 'policzkowy dalszy', 'podniebienny'] : ['bliższy', 'dalszy'];
  return m.upper
    ? ['policzkowy bliższy (MB)', 'policzkowy dalszy (DB)', 'podniebienny (P)', 'MB2']
    : ['bliższy policzkowy (MB)', 'bliższy językowy (ML)', 'dalszy (D)', 'dalszy językowy (DL)'];
}
const CANAL_STATES = [
  { key:'treat', short:'Do leczenia', full:'do leczenia' },
  { key:'done',  short:'Wyleczony',   full:'wyleczony (wypełniony kanałowo)' },
  { key:'under', short:'Niedoleczony',full:'niedoleczony — do ponownego leczenia' },
];
const STATE_LABEL = Object.fromEntries(CANAL_STATES.map(s => [s.key, s.full]));

/* ══ STAN ═════════════════════════════════════════════════════════════════ */
const state = {
  dentition: 'permanent', layer: 'all',
  selection: new Set(), surfaces: new Set(), canal: null,
  dx: null, scopeAsk: 'tooth', query: '', teeth: {}, seq: 100, cseq: 500,
};
[...PERM_UPPER, ...PERM_LOWER, ...DEC_UPPER, ...DEC_LOWER].forEach(fdi => {
  state.teeth[fdi] = { presence: 'present', canals: [], findings: [] };   // FR-063 — zero kanałów na start
});

function addFinding(fdi, o) {
  const f = Object.assign({
    id: 'f' + (state.seq++), tooth: fdi, surfaces: [], canal: null, severity: null, note: '',
    date: o.date || '2026-08-30', author: 'lek. dent. A. Zielińska', role: 'DOCTOR',
    clinical: 'active', record: 'current', supersedes: null,
  }, o);
  f.layer = DXMAP[f.dxCode].layer;
  state.teeth[fdi].findings.push(f);
  const pres = DXMAP[f.dxCode].presence;
  if (pres && f.record === 'current') state.teeth[fdi].presence = pres;
  return f;
}
function addCanal(fdi, name, st) {
  const c = { id: 'c' + (state.cseq++), name, state: st || 'treat' };
  state.teeth[fdi].canals.push(c);
  return c;
}

/* dane wyjściowe — realistyczny przypadek */
addFinding(36, { dxCode:'K02.1', surfaces:['O','M'], date:'2026-08-30', note:'Ubytek sięgający zębiny.' });

/* ══ POMOCNIKI ════════════════════════════════════════════════════════════ */
const f2 = n => Math.round(n * 100) / 100;
const el = (tag, attrs) => {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  return n;
};
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (n === 1) return one;
  if (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) return few;
  return many;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const rows = () => state.dentition === 'permanent' ? [PERM_UPPER, PERM_LOWER]
  : state.dentition === 'deciduous' ? [DEC_UPPER, DEC_LOWER] : [MIXED_UPPER, MIXED_LOWER];
const visibleTeeth = () => rows().flat();
const current = fdi => state.teeth[fdi].findings.filter(f => f.record === 'current');
const activeF = fdi => current(fdi).filter(f => f.clinical === 'active');
const inLayer = f => state.layer === 'all' || f.layer === (state.layer === 'diagnosis' ? 'diagnosis' : 'existing');
const canalById = (fdi, id) => state.teeth[fdi].canals.find(c => c.id === id);

function toothStatus(fdi) {
  const t = state.teeth[fdi];
  if (t.presence === 'extracted' || t.presence === 'agenesis') return 'absent';
  if (t.presence === 'unerupted') return 'unerupted';
  const a = activeF(fdi).filter(inLayer);
  if (a.some(f => f.layer === 'diagnosis')) return 'diseased';
  if (a.some(f => f.layer === 'existing')) return 'restored';
  return 'healthy';
}

/* ══ DIAGRAM ══════════════════════════════════════════════════════════════ */
const VW = 1000, VH = 378, MARGIN = 26, CURVE = 8, TILT = 5;
const Y_UPPER = 112, Y_LOWER = 272;
const BOX_U_CY = 146, BOX_L_CY = 238, LABEL_U_Y = 188, LABEL_L_Y = 204;
const QUAD_U_Y = 14, QUAD_L_Y = 372;
const RATIO = {
  incisor:  { crown: 0.72, root: 1.10, cusps: 1, bump: 0.03 },
  canine:   { crown: 0.78, root: 1.30, cusps: 1, bump: 0.09 },
  premolar: { crown: 0.70, root: 1.10, cusps: 2, bump: 0.08 },
  molar:    { crown: 0.58, root: 0.92, cusps: 3, bump: 0.09 },
};

function crownPath(w, h, cusps, dir, bump) {
  const Y = v => f2(dir * v);
  const nk = w * 0.40, mx = w * 0.50, ex = w / 2 - w * 0.10;
  let d = `M ${f2(-nk)} ${Y(h)}`;
  d += ` C ${f2(-mx)} ${Y(h * 0.74)}, ${f2(-mx)} ${Y(h * 0.28)}, ${f2(-ex)} ${Y(h * 0.05)}`;
  const seg = (2 * ex) / cusps;
  let cx = -ex;
  for (let i = 0; i < cusps; i++) {
    const nx = cx + seg;
    d += ` Q ${f2(cx + seg / 2)} ${Y(-h * bump)}, ${f2(nx)} ${Y(h * 0.05)}`;
    cx = nx;
  }
  d += ` C ${f2(mx)} ${Y(h * 0.28)}, ${f2(mx)} ${Y(h * 0.74)}, ${f2(nk)} ${Y(h)} Z`;
  return d;
}
function rootGeometry(w, crownH, rootH, n, dir) {
  const Y = v => f2(dir * v);
  const CW = w * 0.80, slot = CW / n;
  const yN = crownH, yA = crownH + rootH, yF = crownH + rootH * 0.34;
  const splay = n === 1 ? 1 : 1.18;
  const centers = [], tips = [];
  for (let i = 0; i < n; i++) { const c = -CW / 2 + slot * (i + 0.5); centers.push(c); tips.push(c * splay); }
  const aw = Math.max(Math.min(slot * 0.22, w * 0.07), w * 0.035);
  let d = `M ${f2(-CW / 2)} ${Y(yN)}`, fromX = -CW / 2, fromY = yN;
  for (let i = 0; i < n; i++) {
    const t = tips[i];
    d += ` C ${f2(fromX * 1.02)} ${Y(fromY + (yA - fromY) * 0.42)}, ${f2(t - aw * 1.9)} ${Y(yA - rootH * 0.26)}, ${f2(t - aw)} ${Y(yA)}`;
    d += ` Q ${f2(t)} ${Y(yA + rootH * 0.05)}, ${f2(t + aw)} ${Y(yA)}`;
    if (i < n - 1) {
      const fx = (centers[i] + centers[i + 1]) / 2;
      d += ` C ${f2(t + aw * 1.9)} ${Y(yA - rootH * 0.26)}, ${f2(fx)} ${Y(yF + rootH * 0.24)}, ${f2(fx)} ${Y(yF)}`;
      fromX = fx; fromY = yF;
    } else {
      d += ` C ${f2(t + aw * 1.9)} ${Y(yA - rootH * 0.26)}, ${f2(CW / 2 * 1.02)} ${Y(yN + (yA - yN) * 0.42)}, ${f2(CW / 2)} ${Y(yN)}`;
    }
  }
  return { d: d + ' Z', centers, tips, slot };
}
/* Trzy stany kanału (FR-066a): czerwony / zielony / zielony z czerwonym wierzchołkiem. */
function canalNodes(canals, rg, crownH, rootH, dir, nRoots) {
  const Y = v => dir * v;
  const per = new Array(nRoots).fill(0);
  canals.forEach((_, i) => per[i % nRoots]++);
  const used = new Array(nRoots).fill(0);
  const out = [];
  canals.forEach((c, i) => {
    const ri = i % nRoots, k = used[ri]++;
    const spread = per[ri] === 1 ? 0 : (k - (per[ri] - 1) / 2) * rg.slot * 0.26;
    const x0 = rg.centers[ri] + spread, y0 = Y(crownH + rootH * 0.14);
    const x1 = rg.tips[ri] + spread * 0.4, y1 = Y(crownH + rootH * 0.90);
    const at = t => [f2(x0 + (x1 - x0) * t), f2(y0 + (y1 - y0) * t)];
    if (c.state === 'under') {
      const [mx, my] = at(0.58);
      out.push({ cls: 'canal c-under-body', d: `M ${f2(x0)} ${f2(y0)} L ${mx} ${my}` });
      out.push({ cls: 'canal c-under-apex', d: `M ${mx} ${my} L ${f2(x1)} ${f2(y1)}` });
      out.push({ dot: at(1) });
    } else {
      out.push({ cls: 'canal ' + (c.state === 'done' ? 'c-done' : 'c-treat'), d: `M ${f2(x0)} ${f2(y0)} L ${f2(x1)} ${f2(y1)}` });
      if (c.state === 'treat') out.push({ dot: at(1), treat: true });
    }
  });
  return out;
}
/* schemat powierzchni: góra = przedsionkowa, dół = językowa/podniebienna,
   boki = mezjalna/dystalna zależnie od strony łuku (FR-026, FR-029) */
function zoneDefs(size, right) {
  const o = size / 2, i = size * 0.20;
  const mesialLeft = !right;
  return [
    { k: 'B', d: `M ${-o} ${-o} L ${o} ${-o} L ${i} ${-i} L ${-i} ${-i} Z` },
    { k: 'L', d: `M ${-o} ${o} L ${o} ${o} L ${i} ${i} L ${-i} ${i} Z` },
    { k: mesialLeft ? 'M' : 'D', d: `M ${-o} ${-o} L ${-i} ${-i} L ${-i} ${i} L ${-o} ${o} Z` },
    { k: mesialLeft ? 'D' : 'M', d: `M ${o} ${-o} L ${i} ${-i} L ${i} ${i} L ${o} ${o} Z` },
    { k: 'C', d: `M ${-i} ${-i} L ${i} ${-i} L ${i} ${i} L ${-i} ${i} Z` },
  ];
}

const archSvg = document.getElementById('arch');

function renderArch() {
  archSvg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
  archSvg.textContent = '';
  const g = el('g', {});
  archSvg.appendChild(g);
  g.appendChild(el('line', { x1: VW / 2, y1: 8, x2: VW / 2, y2: VH - 8, class: 'midline' }));

  const [upper, lower] = rows();
  [[upper, true], [lower, false]].forEach(([list, isUpper]) => {
    const n = list.length;
    const colW = Math.min((VW - 2 * MARGIN) / n, 66);
    const rowW = colW * n, x0 = (VW - rowW) / 2;
    const maxRaw = Math.max(...list.map(t => meta(t).width));
    const tScale = (colW - 8) / maxRaw;
    const boxSize = Math.min(colW - 6, 54);

    list.forEach((fdi, idx) => {
      const m = meta(fdi), cx = x0 + colW * (idx + 0.5);
      const t = (cx - VW / 2) / (rowW / 2);
      const dir = isUpper ? -1 : 1;
      const yBase = (isUpper ? Y_UPPER : Y_LOWER) + dir * CURVE * t * t;
      const rot = (isUpper ? 1 : -1) * t * TILT;
      g.appendChild(drawTooth(fdi, m, m.width * tScale, colW, cx, yBase, dir, rot));
      g.appendChild(drawSurfaceBox(fdi, m, cx, isUpper ? BOX_U_CY : BOX_L_CY, boxSize, colW));
      const lbl = el('text', { x: f2(cx), y: isUpper ? LABEL_U_Y : LABEL_L_Y, class: 'tooth-label', 'data-label': fdi });
      lbl.textContent = fdi;
      g.appendChild(lbl);
    });

    const qs = isUpper ? ['ćwiartka 1 · prawa górna', 'ćwiartka 2 · lewa górna']
                       : ['ćwiartka 4 · prawa dolna', 'ćwiartka 3 · lewa dolna'];
    const qy = isUpper ? QUAD_U_Y : QUAD_L_Y;
    g.appendChild(Object.assign(el('text', { x: VW / 2 - rowW / 4, y: qy, class: 'quad-label' }), { textContent: qs[0] }));
    g.appendChild(Object.assign(el('text', { x: VW / 2 + rowW / 4, y: qy, class: 'quad-label' }), { textContent: qs[1] }));
  });
  syncArchClasses();
}

function drawTooth(fdi, m, w, colW, cx, yBase, dir, rot) {
  const r = RATIO[m.type];
  const crownH = w * r.crown, rootH = w * r.root;
  const t = state.teeth[fdi];
  const grp = el('g', { class: 'tooth', transform: `translate(${f2(cx)} ${f2(yBase)}) rotate(${f2(rot)})`,
    'data-fdi': fdi, tabindex: 0, role: 'button' });
  const rg = rootGeometry(w, crownH, rootH, m.roots, dir);
  grp.appendChild(el('path', { d: rg.d, class: 'root' }));
  grp.appendChild(el('path', { d: crownPath(w, crownH, r.cusps, dir, r.bump), class: 'crown' }));
  if (t.canals.length) {
    canalNodes(t.canals, rg, crownH, rootH, dir, m.roots).forEach(node => {
      if (node.dot) grp.appendChild(el('circle', { cx: node.dot[0], cy: node.dot[1], r: 2.6, class: 'canal-apex-dot' }));
      else grp.appendChild(el('path', { d: node.d, class: node.cls }));
    });
  }
  const xs = w * 0.26, cross = el('g', { class: 'absent-cross', transform: `translate(0 ${f2(dir * crownH * 0.5)})` });
  cross.appendChild(el('path', { d: `M ${f2(-xs)} ${f2(-xs)} L ${f2(xs)} ${f2(xs)} M ${f2(xs)} ${f2(-xs)} L ${f2(-xs)} ${f2(xs)}` }));
  grp.appendChild(cross);
  const yTop = dir < 0 ? -(crownH + rootH) - 6 : -8;
  grp.appendChild(el('rect', { class: 'hit', x: f2(-colW / 2), y: f2(yTop), width: f2(colW), height: f2(crownH + rootH + 14) }));
  return grp;
}

function drawSurfaceBox(fdi, m, cx, cy, size, colW) {
  const grp = el('g', { class: 'sbox', transform: `translate(${f2(cx)} ${cy})`, 'data-sbox': fdi });
  grp.appendChild(el('rect', { class: 'boxhit', x: f2(-colW / 2), y: f2(-size / 2 - 6), width: f2(colW), height: f2(size + 12) }));
  zoneDefs(size, m.right).forEach(z => grp.appendChild(el('path', {
    d: z.d, class: 'zone', 'data-zone': z.k, 'data-fdi': fdi,
    role: 'button', tabindex: -1,
  })));
  grp.appendChild(el('rect', { class: 'frame', x: f2(-size / 2), y: f2(-size / 2), width: f2(size), height: f2(size), rx: 2 }));
  return grp;
}

function syncArchClasses() {
  archSvg.querySelectorAll('.tooth').forEach(g => {
    const fdi = +g.dataset.fdi, st = toothStatus(fdi), t = state.teeth[fdi];
    g.classList.toggle('is-diseased', st === 'diseased');
    g.classList.toggle('is-restored', st === 'restored');
    g.classList.toggle('is-absent', st === 'absent');
    g.classList.toggle('is-unerupted', st === 'unerupted');
    g.classList.toggle('is-selected', state.selection.has(fdi));
    const act = activeF(fdi);
    const canalTxt = t.canals.length
      ? `kanały: ${t.canals.map(c => c.name + ' — ' + STATE_LABEL[c.state]).join('; ')}`
      : 'brak odnotowanych kanałów';
    g.setAttribute('aria-label', [`ząb ${fdi}`, meta(fdi).label,
      act.length ? act.map(f => DXMAP[f.dxCode].name + (f.surfaces.length ? ' — ' + f.surfaces.map(s => 'powierzchnia ' + SURFACE_NAME(fdi, s)).join(', ') : '')).join('; ')
        : (st === 'absent' ? 'brak zęba' : 'bez odnotowanych zmian'), canalTxt].join(', '));
    g.setAttribute('aria-pressed', state.selection.has(fdi) ? 'true' : 'false');
  });

  archSvg.querySelectorAll('.sbox').forEach(box => {
    const fdi = +box.dataset.sbox, st = toothStatus(fdi);
    box.classList.toggle('is-selected', state.selection.has(fdi));
    box.classList.toggle('is-absent', st === 'absent');
    const surf = {};
    current(fdi).filter(inLayer).forEach(f => (f.surfaces || []).forEach(s => {
      const key = (s === 'O' || s === 'I') ? 'C' : s;
      const rank = f.clinical === 'closed' ? 1 : f.layer === 'diagnosis' ? 3 : 2;
      if (!surf[key] || surf[key] < rank) surf[key] = rank;
    }));
    const picked = state.selection.has(fdi) ? state.surfaces : new Set();
    box.querySelectorAll('.zone').forEach(z => {
      const k = z.dataset.zone, rank = surf[k] || 0;
      z.classList.toggle('f-diag', rank === 3);
      z.classList.toggle('f-rest', rank === 2);
      z.classList.toggle('f-done', rank === 1);
      z.classList.toggle('picked', picked.has(k === 'C' ? (meta(fdi).anterior ? 'I' : 'O') : k));
      const sName = SURFACE_NAME(fdi, k === 'C' ? (meta(fdi).anterior ? 'I' : 'O') : k);
      z.setAttribute('aria-label', `ząb ${fdi}, powierzchnia ${sName}`);
    });
  });

  archSvg.querySelectorAll('[data-label]').forEach(n =>
    n.classList.toggle('is-sel', state.selection.has(+n.dataset.label)));
}

/* ══ INSPEKTOR ════════════════════════════════════════════════════════════ */
const inspBody = document.getElementById('inspBody');
const inspHeading = document.getElementById('inspHeading');
const inspMode = document.getElementById('inspMode');

function surfaceMapSvg(fdi) {
  const m = meta(fdi), occ = m.anterior ? 'I' : 'O', mesialLeft = !m.right;
  const S = 168, o = S / 2, i = S * 0.20, c = 96;
  const zones = [
    { k:'B', d:`M ${-o} ${-o} L ${o} ${-o} L ${i} ${-i} L ${-i} ${-i} Z`, lx:0, ly:-o * 0.72 },
    { k:'L', d:`M ${-o} ${o} L ${o} ${o} L ${i} ${i} L ${-i} ${i} Z`, lx:0, ly:o * 0.80 },
    { k: mesialLeft ? 'M' : 'D', d:`M ${-o} ${-o} L ${-i} ${-i} L ${-i} ${i} L ${-o} ${o} Z`, lx:-o * 0.72, ly:4 },
    { k: mesialLeft ? 'D' : 'M', d:`M ${o} ${-o} L ${i} ${-i} L ${i} ${i} L ${o} ${o} Z`, lx:o * 0.72, ly:4 },
    { k: occ, d:`M ${-i} ${-i} L ${i} ${-i} L ${i} ${i} L ${-i} ${i} Z`, lx:0, ly:4 },
  ];
  const bySurface = {};
  current(fdi).filter(inLayer).forEach(f => (f.surfaces || []).forEach(s => {
    bySurface[s] = f.clinical === 'closed' ? 'done' : f.layer;
  }));
  const parts = zones.map(z => {
    const cls = ['sf'];
    if (bySurface[z.k] === 'diagnosis') cls.push('has-diag');
    if (bySurface[z.k] === 'existing') cls.push('has-rest');
    if (state.surfaces.has(z.k)) cls.push('picked');
    return `<path class="${cls.join(' ')}" d="${z.d}" data-surface="${z.k}" role="button" tabindex="0"
      aria-pressed="${state.surfaces.has(z.k)}" aria-label="powierzchnia ${esc(SURFACE_NAME(fdi, z.k))}"></path>
      <text class="sf-label" x="${z.lx}" y="${z.ly}">${z.k}</text>`;
  }).join('');
  return `<svg class="surface-map" viewBox="0 0 192 192" aria-label="Powierzchnie zęba ${fdi}">
    <g transform="translate(${c} ${c})">${parts}</g></svg>`;
}

function canalCard(fdi) {
  const t = state.teeth[fdi];
  const sug = suggestedCanals(fdi);
  const rootScope = state.dx && (DXMAP[state.dx].scope === 'root' || (DXMAP[state.dx].scope === 'ask' && state.scopeAsk === 'root'));
  const findingsByCanal = {};
  current(fdi).forEach(f => { if (f.canal) (findingsByCanal[f.canal] = findingsByCanal[f.canal] || []).push(DXMAP[f.dxCode].name); });

  if (!t.canals.length) {
    return `<div class="detail-card">
      <h3>Kanały korzeniowe<span class="fr">FR-063</span></h3>
      <div class="canal-empty">
        <p class="hint">Nie odnotowano kanałów. Kanały zakłada lekarz lub asystentka w trakcie leczenia —
          system nie zakłada ich z góry.</p>
        <p class="hint">Typowo dla tego zęba: ${sug.length} (${esc(sug.join(', '))})<span class="fr">FR-064</span></p>
        <div class="canal-add">
          <button type="button" class="btn btn-ghost btn-sm" data-add-canal="1">+ Dodaj kanał</button>
          ${sug.length > 1 ? `<button type="button" class="btn btn-ghost btn-sm" data-add-canal="${Math.min(sug.length, 3)}">+ Dodaj typowe (${Math.min(sug.length, 3)})</button>` : ''}
        </div>
      </div></div>`;
  }
  return `<div class="detail-card">
    <h3>Kanały korzeniowe · ${t.canals.length}<span class="fr">FR-065 · FR-066</span></h3>
    <ul class="canal-list">
      ${t.canals.map(c => `<li class="canal-item s-${c.state}">
        <div class="ci-top">
          <span class="canal-name">${esc(c.name)}<small>${esc(STATE_LABEL[c.state])}${findingsByCanal[c.id] ? ' · ' + esc(findingsByCanal[c.id].join(', ')) : ''}</small></span>
          <button type="button" class="canal-del" data-canal-del="${c.id}" title="Usuń kanał" aria-label="Usuń kanał ${esc(c.name)}">×</button>
        </div>
        <div class="ci-bottom">
          <span class="state-seg" role="group" aria-label="Stan kanału ${esc(c.name)}">
            ${CANAL_STATES.map(s => `<button type="button" data-canal-state="${c.id}:${s.key}" aria-pressed="${c.state === s.key}"
              title="${esc(s.full)}"><span class="state-dot sd-${s.key}"></span>${s.short}</button>`).join('')}
          </span>
          ${rootScope ? `<button type="button" class="canal-pick" data-canal-pick="${c.id}" aria-pressed="${state.canal === c.id}">${state.canal === c.id ? 'wybrany' : 'wybierz'}</button>` : ''}
        </div>
      </li>`).join('')}
    </ul>
    ${t.canals.length < 6 ? `<div class="canal-add"><button type="button" class="btn btn-ghost btn-sm" data-add-canal="1">+ Dodaj kanał</button></div>` : ''}
  </div>`;
}

function dxPicker(query) {
  const q = (query || '').trim().toLowerCase();
  const hits = DX.filter(d => !q || d.name.toLowerCase().includes(q) || (d.icd || '').toLowerCase().includes(q) || d.code.toLowerCase().includes(q));
  let html = '';
  CAT.forEach(([key, label]) => {
    const inCat = hits.filter(d => d.cat === key);
    if (!inCat.length) return;
    html += `<li class="dx-group">${label}</li>`;
    inCat.forEach(d => {
      const scopeCls = { surface:'scope-surface', tooth:'scope-tooth', root:'scope-root', perio:'scope-perio', ask:'scope-tooth' }[d.scope];
      const scopeTxt = { surface:'powierzchnia', tooth:'cały ząb', root:'korzeń/kanał', perio:'przyzębie', ask:'wybierz zakres' }[d.scope];
      html += `<li><button type="button" class="dx-item" data-dx="${d.code}" aria-pressed="${state.dx === d.code}">
        <span class="layer-dot ${d.layer === 'diagnosis' ? 'layer-diag' : 'layer-rest'}"></span>
        <span class="dx-name">${esc(d.name)}</span>
        <span class="scope-tag ${scopeCls}">${scopeTxt}</span>
        <span class="dx-meta">${d.icd || '—'}</span></button></li>`;
    });
  });
  return html || `<li class="empty" style="padding:14px">Brak pozycji dla „${esc(query)}”. Użyj „Inne rozpoznanie”.</li>`;
}

function effScope() {
  if (!state.dx) return null;
  const d = DXMAP[state.dx];
  return d.scope === 'ask' ? state.scopeAsk : d.scope;
}
function validation() {
  const sel = [...state.selection];
  if (!sel.length) return 'Zaznacz co najmniej jeden ząb.';
  if (!state.dx) return 'Wybierz pozycję ze słownika rozpoznań.';
  const d = DXMAP[state.dx];
  if (d.needsNote && !document.getElementById('noteField')?.value.trim())
    return 'Pozycja „inne rozpoznanie” wymaga opisu (FR-011a).';
  if (effScope() === 'surface' && !state.surfaces.size)
    return 'To rozpoznanie dotyczy powierzchni — wskaż co najmniej jedną (FR-022).';
  if (effScope() === 'root' && sel.length === 1 && !state.teeth[sel[0]].canals.length)
    return 'To rozpoznanie dotyczy korzenia lub kanału — najpierw odnotuj kanał (FR-067).';
  return null;
}

function findingRow(f) {
  const d = DXMAP[f.dxCode];
  const cls = ['finding'];
  if (f.layer === 'existing') cls.push('rest');
  if (f.clinical === 'closed') cls.push('done');
  if (f.record === 'superseded') cls.push('stale');
  const c = f.canal ? canalById(f.tooth, f.canal) : null;
  const loc = f.surfaces.length ? f.surfaces.join('') + ' · ' + f.surfaces.map(s => SURFACE_NAME(f.tooth, s)).join(', ')
    : f.canal ? (c ? 'kanał: ' + c.name : 'kanał nieobecny w modelu')
    : d.scope === 'perio' ? 'przyzębie' : 'cały ząb';
  const pill = f.record === 'superseded' ? '<span class="status-pill pill-stale">nieaktualny</span>'
    : f.clinical === 'closed' ? '<span class="status-pill pill-done">zakończone</span>'
    : '<span class="status-pill pill-active">aktywne</span>';
  return `<li class="${cls.join(' ')}" data-finding="${f.id}">
    <div class="finding-top"><span class="finding-name">${esc(d.name)}</span>${pill}
      ${d.needsNote ? '<span class="status-pill pill-flag">do doprecyzowania</span>' : ''}
      ${f.canal && !c ? '<span class="status-pill pill-flag">kanał usunięty</span>' : ''}</div>
    <div class="finding-loc">${esc(loc)}${f.severity ? ' · ' + esc(f.severity) : ''}</div>
    <div class="finding-meta">ząb ${f.tooth} · ${f.date} · ${esc(f.author)} (${f.role})${f.closedAt ? ' · zakończono ' + f.closedAt : ''}</div>
    ${f.note ? `<div class="finding-note">${esc(f.note)}</div>` : ''}
    ${f.record === 'current' && f.clinical === 'active' ? `<div class="finding-actions">
      <button type="button" class="link-btn" data-close="${f.id}">Zakończ (wyleczone)</button>
      <button type="button" class="link-btn" data-correct="${f.id}">Koryguj</button></div>` : ''}
  </li>`;
}

function renderInspector() {
  const sel = [...state.selection].sort((a, b) => a - b);
  if (!sel.length) {
    inspHeading.textContent = 'Wybrany ząb';
    inspMode.textContent = 'nic nie zaznaczono';
    inspBody.innerHTML = `<div class="empty">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 6c5 0 8 3 8 8 0 6-2 8-3 14-1 4-4 4-5 0-1-6-3-8-3-14 0-5 3-8 3-8z" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg>
      Dotknij zęba albo jego schematu powierzchni, żeby zobaczyć stan i dodać rozpoznanie.<br>
      Przeciągnij po kilku zębach albo użyj skrótów, żeby zaznaczyć grupę.
      <span class="fr">FR-004 · FR-054</span></div>`;
    return;
  }
  const multi = sel.length > 1;
  inspHeading.textContent = multi ? 'Zaznaczone zęby' : 'Wybrany ząb';
  inspMode.textContent = multi ? `${sel.length} ${plural(sel.length, 'ząb', 'zęby', 'zębów')}` : 'pojedynczo';

  const fdi = sel[0], m = meta(fdi), t = state.teeth[fdi];
  const dx = state.dx ? DXMAP[state.dx] : null;
  const scope = effScope();
  const problem = validation();

  const head = multi
    ? `<div><div class="tooth-title"><span class="fdi">${sel.length}</span>
        <span class="tooth-anat">zaznaczonych zębów · wpis powstanie osobno dla każdego<span class="fr">FR-004a</span></span></div>
        <div class="finding-meta" style="margin-top:6px">${sel.join(' · ')}</div></div>`
    : `<div><div class="tooth-title"><span class="fdi">${fdi}</span>
        <span class="tooth-anat">${esc(m.label)}${m.deciduous ? ' · ząb mleczny' : ''}</span></div>
        <div class="finding-meta" style="margin-top:4px">
          ${t.presence === 'present' ? 'ząb obecny' : t.presence === 'extracted' ? 'ząb usunięty' : t.presence === 'agenesis' ? 'wrodzony brak zęba' : 'ząb niewyrznięty / zatrzymany'}
          · ${m.roots} ${plural(m.roots, 'korzeń', 'korzenie', 'korzeni')}
          · ${t.canals.length ? `${t.canals.length} ${plural(t.canals.length, 'kanał', 'kanały', 'kanałów')}` : 'brak odnotowanych kanałów'}
          <span class="fr">FR-005</span></div></div>`;

  const detail = multi
    ? `<div class="detail-card"><h3>Części zęba wspólne dla zaznaczenia<span class="fr">FR-004a</span></h3>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${['M','D','B','L','O','I'].map(s => `<button type="button" class="chip" data-surface-chip="${s}" aria-pressed="${state.surfaces.has(s)}">${s}</button>`).join('')}
        </div>
        <p class="hint" style="margin-top:8px">Powierzchnie nieistniejące dla danego zęba (np. żująca w siekaczu) zostaną pominięte i wymienione przed zapisem.</p></div>`
    : `<div class="detail-card"><h3>Powierzchnie<span class="fr">FR-024 · FR-026</span></h3>${surfaceMapSvg(fdi)}
        <p class="hint" style="margin-top:8px">${esc(m.surfaces.map(s => s + ' — ' + SURFACE_NAME(fdi, s)).join(' · '))}</p></div>`;

  const pool = multi ? sel.flatMap(x => state.teeth[x].findings) : t.findings;
  const findings = pool.filter(f => f.record === 'current' && f.clinical === 'active');
  const history = pool.filter(f => f.record === 'superseded' || f.clinical === 'closed');

  inspBody.innerHTML = `
    ${head}
    <div class="detail-grid">${detail}${multi ? '' : canalCard(fdi)}</div>

    <div class="field">
      <label for="dxSearch">Jednostka chorobowa / stan<span class="fr">FR-011 · FR-013</span></label>
      <input type="text" id="dxSearch" placeholder="Szukaj po nazwie lub kodzie ICD-10…" value="${esc(state.query)}" autocomplete="off">
      <ul class="dx-list" id="dxList">${dxPicker(state.query)}</ul>
    </div>

    ${dx && dx.scope === 'ask' ? `<div class="field"><label for="scopeSel">Zakres anatomiczny<span class="fr">FR-011a</span></label>
      <select id="scopeSel">
        <option value="surface" ${state.scopeAsk === 'surface' ? 'selected' : ''}>powierzchnia zęba</option>
        <option value="tooth" ${state.scopeAsk === 'tooth' ? 'selected' : ''}>cały ząb</option>
        <option value="root" ${state.scopeAsk === 'root' ? 'selected' : ''}>korzeń / kanał</option>
        <option value="perio" ${state.scopeAsk === 'perio' ? 'selected' : ''}>przyzębie</option>
      </select></div>` : ''}

    ${dx && dx.sev ? `<div class="field"><label for="sevSel">Nasilenie / stan<span class="fr">FR-018</span></label>
      <select id="sevSel">${dx.sev.map(s => `<option>${esc(s)}</option>`).join('')}</select></div>` : ''}

    <div class="field">
      <label for="noteField">Notatka${dx && dx.needsNote ? ' (wymagana)' : ' (opcjonalna)'}<span class="fr">FR-017</span></label>
      <textarea id="noteField" placeholder="Np. ubytek sięgający zębiny, bez objawów ze strony miazgi."></textarea>
    </div>

    <div class="field" style="max-width:180px">
      <label for="dateField">Data rozpoznania<span class="fr">FR-036</span></label>
      <input type="date" id="dateField" value="2026-08-30" max="2026-08-30">
    </div>

    ${problem ? `<p class="hint block">▲ ${esc(problem)}</p>`
      : `<p class="hint">Zapis utworzy ${sel.length === 1 ? 'jeden wpis' : sel.length + ' ' + plural(sel.length, 'odrębny wpis', 'odrębne wpisy', 'odrębnych wpisów')}; każdy z własną historią i możliwością korekty.</p>`}

    <div class="actions">
      <button type="button" class="btn btn-primary" id="saveBtn" ${problem ? 'disabled' : ''}>Zapisz ${sel.length > 1 ? 'wpisy' : 'wpis'}</button>
      <button type="button" class="btn btn-ghost" id="resetBtn">Wyczyść formularz</button>
    </div>

    <div>
      <div class="eyebrow" style="margin-bottom:8px">Bieżące wpisy<span class="fr">FR-034</span></div>
      ${findings.length ? `<ul class="findings">${findings.map(findingRow).join('')}</ul>`
        : `<p class="empty" style="padding:12px">Brak odnotowanych zmian.</p>`}
    </div>

    ${history.length ? `<details><summary style="cursor:pointer;font-size:13px;color:var(--text-muted);font-weight:500">
        Historia zęba (${history.length})<span class="fr">FR-034</span></summary>
      <ul class="findings" style="margin-top:8px">${history.map(findingRow).join('')}</ul></details>` : ''}`;
}

/* ══ INTERAKCJE ═══════════════════════════════════════════════════════════ */
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg) {
  toastEl.innerHTML = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4600);
}
function prefersReduced() { return matchMedia('(prefers-reduced-motion: reduce)').matches; }
function narrow() { return window.innerWidth < 1260; }
const backBtn = document.getElementById('backToArch');
function syncBackBtn() { backBtn.classList.toggle('on', narrow() && state.selection.size > 0); }
backBtn.addEventListener('click', () => document.querySelector('.arch-wrap')
  .scrollIntoView({ behavior: prefersReduced() ? 'auto' : 'smooth', block: 'start' }));

function refresh() { syncArchClasses(); renderInspector(); updateSelBar(); renderOverview(); syncBackBtn(); }
function updateSelBar() {
  const n = state.selection.size, c = document.getElementById('selCount'), parts = [];
  if (n) parts.push(`${n} ${plural(n, 'ząb', 'zęby', 'zębów')}`);
  const sn = state.surfaces.size;
  if (sn) parts.push(`${sn} ${plural(sn, 'powierzchnia', 'powierzchnie', 'powierzchni')}`);
  c.textContent = parts.length ? parts.join(' · ') : 'nic nie zaznaczono';
  c.classList.toggle('on', n > 0);
}
function selectTooth(fdi, additive) {
  if (additive) {
    state.selection.has(fdi) ? state.selection.delete(fdi) : state.selection.add(fdi);
  } else {
    const only = state.selection.size === 1 && state.selection.has(fdi);
    state.selection.clear();
    if (!only) state.selection.add(fdi);
    state.surfaces.clear();
    state.canal = null;
  }
  refresh();
}
function toggleSurface(s) {
  state.surfaces.has(s) ? state.surfaces.delete(s) : state.surfaces.add(s);
  refresh();
}

let dragging = false, dragAdded = new Set();
archSvg.addEventListener('pointerdown', e => {
  const zone = e.target.closest('.zone');
  if (zone) {
    const fdi = +zone.dataset.fdi, m = meta(fdi);
    const key = zone.dataset.zone === 'C' ? (m.anterior ? 'I' : 'O') : zone.dataset.zone;
    if (!state.selection.has(fdi) || state.selection.size > 1) { state.selection.clear(); state.selection.add(fdi); state.surfaces.clear(); }
    toggleSurface(key);
    return;
  }
  const box = e.target.closest('.sbox');
  if (box) { selectTooth(+box.dataset.sbox, e.shiftKey || e.ctrlKey || e.metaKey); return; }
  const g = e.target.closest('.tooth');
  if (!g) return;
  const fdi = +g.dataset.fdi;
  dragging = true; dragAdded = new Set([fdi]);
  selectTooth(fdi, e.shiftKey || e.ctrlKey || e.metaKey);
  g.focus({ preventScroll: true });
});
archSvg.addEventListener('pointerover', e => {
  if (!dragging) return;
  const g = e.target.closest('.tooth');
  if (!g) return;
  const fdi = +g.dataset.fdi;
  if (dragAdded.has(fdi)) return;
  dragAdded.add(fdi);
  state.selection.add(fdi);
  refresh();
});
window.addEventListener('pointerup', () => { dragging = false; });

archSvg.addEventListener('keydown', e => {
  const g = e.target.closest('.tooth');
  if (!g) return;
  const list = [...archSvg.querySelectorAll('.tooth')];
  const i = list.indexOf(g), perRow = rows()[0].length;
  let next = null;
  if (e.key === 'ArrowRight') next = list[Math.min(i + 1, list.length - 1)];
  else if (e.key === 'ArrowLeft') next = list[Math.max(i - 1, 0)];
  else if (e.key === 'ArrowDown') next = list[Math.min(i + perRow, list.length - 1)];
  else if (e.key === 'ArrowUp') next = list[Math.max(i - perRow, 0)];
  else if (e.key === 'Home') next = list[0];
  else if (e.key === 'End') next = list[list.length - 1];
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectTooth(+g.dataset.fdi, e.shiftKey); return; }
  else return;
  e.preventDefault();
  next?.focus({ preventScroll: true });
});

document.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
  const kind = b.dataset.pick;
  visibleTeeth().filter(fdi => {
    const m = meta(fdi);
    switch (kind) {
      case 'q1': return m.q === 1 || m.q === 5;
      case 'q2': return m.q === 2 || m.q === 6;
      case 'q3': return m.q === 3 || m.q === 7;
      case 'q4': return m.q === 4 || m.q === 8;
      case 'upper': return m.upper;
      case 'lower': return !m.upper;
      case 'anterior': return m.anterior;
      case 'posterior': return !m.anterior;
    }
  }).forEach(fdi => state.selection.add(fdi));
  refresh();
}));
document.getElementById('clearSel').addEventListener('click', () => {
  state.selection.clear(); state.surfaces.clear(); state.canal = null; refresh();
});
document.querySelectorAll('[data-layer]').forEach(b => b.addEventListener('click', () => {
  state.layer = b.dataset.layer;
  document.querySelectorAll('[data-layer]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  refresh();
}));
document.querySelectorAll('[data-dentition]').forEach(b => b.addEventListener('click', () => {
  state.dentition = b.dataset.dentition;
  document.querySelectorAll('[data-dentition]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  const vis = new Set(visibleTeeth());
  const hiddenWithData = Object.keys(state.teeth).map(Number)
    .filter(t => !vis.has(t) && (state.teeth[t].findings.length || state.teeth[t].canals.length)).sort((a, b) => a - b);
  [...state.selection].filter(t => !vis.has(t)).forEach(t => state.selection.delete(t));
  renderArch(); refresh();
  if (hiddenWithData.length) toast(`Ukryto ${hiddenWithData.length} ${plural(hiddenWithData.length, 'pozycję', 'pozycje', 'pozycji')} z wpisami (${hiddenWithData.join(', ')}) — nic nie zostało usunięte. <b>FR-047</b>`);
}));

inspBody.addEventListener('click', e => {
  const surf = e.target.closest('[data-surface]');
  if (surf) return toggleSurface(surf.dataset.surface);
  const chip = e.target.closest('[data-surface-chip]');
  if (chip) return toggleSurface(chip.dataset.surfaceChip);
  const dxBtn = e.target.closest('[data-dx]');
  if (dxBtn) {
    state.dx = state.dx === dxBtn.dataset.dx ? null : dxBtn.dataset.dx;
    const d = state.dx && DXMAP[state.dx];
    if (d && d.scope !== 'surface' && d.scope !== 'ask') state.surfaces.clear();
    return refresh();
  }
  const add = e.target.closest('[data-add-canal]');
  if (add) return addCanals(+add.dataset.addCanal);
  const st = e.target.closest('[data-canal-state]');
  if (st) return setCanalState(...st.dataset.canalState.split(':'));
  const pick = e.target.closest('[data-canal-pick]');
  if (pick) { state.canal = state.canal === pick.dataset.canalPick ? null : pick.dataset.canalPick; return refresh(); }
  const del = e.target.closest('[data-canal-del]');
  if (del) return deleteCanal(del.dataset.canalDel);
  if (e.target.id === 'saveBtn') return save();
  if (e.target.id === 'resetBtn') { state.dx = null; state.surfaces.clear(); state.canal = null; state.query = ''; return refresh(); }
  const close = e.target.closest('[data-close]');
  if (close) return closeFinding(close.dataset.close);
  const corr = e.target.closest('[data-correct]');
  if (corr) return correctFinding(corr.dataset.correct);
});
inspBody.addEventListener('keydown', e => {
  const s = e.target.closest('[data-surface]');
  if (s && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleSurface(s.dataset.surface); }
});
inspBody.addEventListener('input', e => {
  if (e.target.id === 'dxSearch') {
    state.query = e.target.value;
    document.getElementById('dxList').innerHTML = dxPicker(state.query);
  }
});
inspBody.addEventListener('change', e => {
  if (e.target.id === 'scopeSel') { state.scopeAsk = e.target.value; refresh(); }
});

/* ── kanały (FR-063..FR-069) ── */
function addCanals(howMany) {
  const fdi = [...state.selection][0], t = state.teeth[fdi];
  const sug = suggestedCanals(fdi);
  let added = 0;
  for (let i = 0; i < howMany && t.canals.length < 6; i++) {
    const idx = t.canals.length;
    addCanal(fdi, sug[idx] || `kanał dodatkowy ${idx + 1}`, 'treat');
    added++;
  }
  renderArch(); refresh();
  toast(`Ząb ${fdi}: dodano ${added} ${plural(added, 'kanał', 'kanały', 'kanałów')} ze stanem „do leczenia”. Zmień stan, gdy leczenie postąpi. <b>FR-065</b>`);
}
function setCanalState(id, st) {
  const fdi = [...state.selection][0];
  const c = canalById(fdi, id);
  if (!c || c.state === st) return;
  c.state = st;
  renderArch(); refresh();
  toast(`Ząb ${fdi}, ${c.name}: ${STATE_LABEL[st]}. <b>FR-066</b>`);
}
function deleteCanal(id) {
  const fdi = [...state.selection][0], t = state.teeth[fdi];
  const c = canalById(fdi, id);
  const attached = current(fdi).filter(f => f.canal === id);
  if (attached.length && !confirm(
    `Usuwasz kanał „${c.name}”. ${attached.length} ${plural(attached.length, 'wpis jest do niego przypisany', 'wpisy są do niego przypisane', 'wpisów jest do niego przypisanych')}. `
    + 'Wpisy zostaną zachowane i oznaczone jako dotyczące kanału nieobecnego w modelu. Kontynuować?')) return;
  t.canals = t.canals.filter(x => x.id !== id);
  if (state.canal === id) state.canal = null;
  renderArch(); refresh();
  toast(`Ząb ${fdi}: usunięto kanał „${c.name}”. Powiązane wpisy pozostają w historii zęba. <b>FR-068</b>`);
}

function save() {
  if (validation()) return;
  const d = DXMAP[state.dx], scope = effScope();
  const note = document.getElementById('noteField').value.trim();
  const date = document.getElementById('dateField').value;
  const sev = document.getElementById('sevSel')?.value || null;
  const made = [], skipped = [];
  [...state.selection].sort((a, b) => a - b).forEach(fdi => {
    const m = meta(fdi), t = state.teeth[fdi];
    const absent = t.presence === 'extracted' || t.presence === 'agenesis';
    if (absent && !d.absentOk) { skipped.push(`${fdi} — brak zęba (FR-040)`); return; }
    if (d.absentOnly && !absent) { skipped.push(`${fdi} — pozycja ma własny ząb`); return; }
    let surfaces = [];
    if (scope === 'surface') {
      surfaces = [...state.surfaces].filter(s => m.surfaces.includes(s));
      if (!surfaces.length) { skipped.push(`${fdi} — brak wskazanych powierzchni w tym zębie`); return; }
    }
    let canal = null;
    if (scope === 'root') {
      if (!t.canals.length) { skipped.push(`${fdi} — brak odnotowanych kanałów (FR-067)`); return; }
      canal = state.canal && canalById(fdi, state.canal) ? state.canal : null;
    }
    addFinding(fdi, { dxCode: state.dx, surfaces, canal, severity: sev, note, date });
    made.push(fdi);
  });
  state.dx = null; state.surfaces.clear(); state.canal = null; state.query = '';
  renderArch(); refresh();
  let msg = made.length
    ? `Zapisano ${made.length} ${plural(made.length, 'wpis', 'wpisy', 'wpisów')} (${plural(made.length, 'ząb', 'zęby', 'zęby')} ${made.join(', ')}).`
    : 'Nie zapisano żadnego wpisu.';
  if (skipped.length) msg += `<br>Pominięto: ${skipped.join('; ')}.`;
  toast(msg);
}
function findById(id) {
  for (const k in state.teeth) { const f = state.teeth[k].findings.find(x => x.id === id); if (f) return f; }
}
function closeFinding(id) {
  const f = findById(id);
  f.clinical = 'closed';
  f.closedAt = '2026-08-30';
  const dxp = DXMAP[f.dxCode];
  if (dxp.presence === 'unerupted' && state.teeth[f.tooth].presence === 'unerupted') state.teeth[f.tooth].presence = 'present';
  renderArch(); refresh();
  toast(`Ząb ${f.tooth}: rozpoznanie „${DXMAP[f.dxCode].name}” oznaczone jako zakończone. Wpis pozostaje w historii zęba. <b>FR-032</b>`);
}
function correctFinding(id) {
  const f = findById(id);
  f.record = 'superseded';
  const dxp = DXMAP[f.dxCode];
  if (dxp.presence && state.teeth[f.tooth].presence === dxp.presence) state.teeth[f.tooth].presence = 'present';
  state.selection.clear(); state.selection.add(f.tooth);
  state.dx = f.dxCode; state.surfaces = new Set(f.surfaces); state.canal = f.canal; state.query = '';
  renderArch(); refresh();
  const nf = document.getElementById('noteField');
  if (nf) nf.value = f.note;
  toast('Poprzedni wpis oznaczony jako nieaktualny i przeniesiony do historii zęba. Popraw dane i zapisz — powstanie nowy wpis wskazujący poprzedni. <b>FR-033</b>');
}

/* ── przegląd ── */
function renderOverview() {
  let diag = 0, rest = 0, absent = 0, cTreat = 0, cUnder = 0, cDone = 0;
  const attention = [];
  visibleTeeth().forEach(fdi => {
    const t = state.teeth[fdi], a = activeF(fdi);
    const d = a.filter(f => f.layer === 'diagnosis');
    if (d.length) { diag += d.length; attention.push({ fdi, kind: 'diag', txt: DXMAP[d[0].dxCode].name }); }
    rest += a.filter(f => f.layer === 'existing').length;
    if (t.presence === 'extracted' || t.presence === 'agenesis') { absent++; attention.push({ fdi, kind: 'absent', txt: 'brak zęba' }); }
    t.canals.forEach(c => { if (c.state === 'treat') cTreat++; else if (c.state === 'under') cUnder++; else cDone++; });
    if (t.canals.some(c => c.state === 'under')) attention.push({ fdi, kind: 'under', txt: 'kanał niedoleczony' });
  });
  document.getElementById('overview').innerHTML = `
    <div class="ov-stats">
      <span class="ov-stat ov-diag"><b>${diag}</b><span>${plural(diag, 'aktywne rozpoznanie', 'aktywne rozpoznania', 'aktywnych rozpoznań')}</span></span>
      <span class="ov-stat ov-rest"><b>${rest}</b><span>${plural(rest, 'wpis stanu istniejącego', 'wpisy stanu istniejącego', 'wpisów stanu istniejącego')}</span></span>
      <span class="ov-stat ov-absent"><b>${absent}</b><span>${plural(absent, 'brak zębowy', 'braki zębowe', 'braków zębowych')}</span></span>
      <span class="ov-stat ov-canal"><b>${cDone}/${cUnder}/${cTreat}</b><span>kanały: wyleczone / niedoleczone / do leczenia</span></span>
    </div>
    ${attention.length ? `<div class="ov-list"><span class="eyebrow">Wymaga uwagi</span>
      ${attention.slice(0, 14).map(a => `<button type="button" class="ov-tooth" data-goto="${a.fdi}" title="${esc(a.txt)}">
        <span class="dotm" style="background:${a.kind === 'diag' ? 'var(--error)' : a.kind === 'under' ? 'var(--warning)' : 'var(--text-disabled)'}"></span>
        <b>${a.fdi}</b> ${esc(a.txt.length > 22 ? a.txt.slice(0, 21) + '…' : a.txt)}</button>`).join('')}
      ${attention.length > 14 ? `<span class="eyebrow">+${attention.length - 14}</span>` : ''}</div>`
      : `<p class="hint">Brak odnotowanych zmian w widocznym uzębieniu.</p>`}`;
}
document.getElementById('overview').addEventListener('click', e => {
  const b = e.target.closest('[data-goto]');
  if (!b) return;
  selectTooth(+b.dataset.goto, false);
  document.querySelector(`.tooth[data-fdi="${b.dataset.goto}"]`)?.focus({ preventScroll: true });
});

/* ── legenda ── */
function renderLegend() {
  const box = (fill, stroke, dash, w) =>
    `<rect x="5" y="5" width="18" height="18" rx="3" fill="${fill}" stroke="${stroke}" stroke-width="${w || 1.4}"${dash ? ' stroke-dasharray="3 3"' : ''}></rect>`;
  const canal = inner => `<g>${inner}</g>`;
  const items = [
    ['bez odnotowanych zmian', box('var(--tooth-fill)', 'var(--tooth-stroke)')],
    ['aktywne rozpoznanie (kreskowanie)', box('url(#hatchDiag2)', 'var(--tooth-diseased-stroke)')],
    ['stan istniejący / uzupełnienie', box('var(--tooth-restored-fill)', 'var(--tooth-restored-stroke)')],
    ['rozpoznanie zakończone (sam obrys)', box('var(--tooth-fill)', 'var(--tooth-closed-stroke)', false, 2.2)],
    ['brak zęba — usunięty lub wrodzony', box('none', 'var(--tooth-absent)', true) + '<path d="M7 7l14 14M21 7L7 21" stroke="var(--tooth-absent)" stroke-width="1.4"></path>'],
    ['ząb niewyrznięty / zatrzymany', box('var(--tooth-fill)', 'var(--tooth-stroke)', true)],
    ['ząb zaznaczony', box('var(--tooth-fill)', 'var(--tooth-selected-stroke)', false, 2.6)],
    ['kanał do leczenia', canal('<path d="M14 4V24" stroke="var(--canal-treat)" stroke-width="3.4" stroke-dasharray="5 3.4" stroke-linecap="round"></path><circle cx="14" cy="24" r="2.6" fill="var(--canal-treat)"></circle>')],
    ['kanał wyleczony (wypełniony)', canal('<path d="M14 4V24" stroke="var(--canal-done)" stroke-width="3.4" stroke-linecap="round"></path>')],
    ['kanał niedoleczony (czerwony wierzchołek)', canal('<path d="M14 4V16" stroke="var(--canal-done)" stroke-width="3.4" stroke-linecap="round"></path><path d="M14 16V24" stroke="var(--canal-treat)" stroke-width="3.4" stroke-linecap="round"></path><circle cx="14" cy="24" r="2.6" fill="var(--canal-treat)"></circle>')],
  ];
  document.getElementById('legendGrid').innerHTML = items.map(([label, inner]) =>
    `<span class="legend-item"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">${inner}</svg>${esc(label)}</span>`).join('');
}

/* ── motyw i odniesienia do wymagań ── */
const themeBtn = document.getElementById('themeToggle');
themeBtn.addEventListener('click', () => {
  const root = document.documentElement;
  const now = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = now === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  document.getElementById('themeIcon').textContent = next === 'dark' ? '◑' : '◐';
  document.getElementById('themeLabel').textContent = next === 'dark' ? 'Ciemny' : 'Jasny';
});
const frBtn = document.getElementById('frToggle');
frBtn.addEventListener('click', () => {
  frBtn.setAttribute('aria-pressed', String(document.documentElement.classList.toggle('show-fr')));
});

/* ── start ── */
document.documentElement.lang = 'pl';
renderArch(); renderLegend();
state.selection.add(36);
refresh();
})();
</script>
