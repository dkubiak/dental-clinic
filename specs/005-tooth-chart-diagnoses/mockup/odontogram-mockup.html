<title>Karta uzębienia Projekt Uśmiech</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ── Tokeny: lustrzane wobec design/brand/_pu-tokens.scss ───────────────── */
:root {
  --bg: #FAF7F2;
  --surface: #FFFFFF;
  --surface-raised: #F2EDE6;
  --border: #E6DFD5;
  --border-strong: #7D746F;
  --text: #1F1D1E;
  --text-muted: #5C5654;
  --text-disabled: #8C8480;
  --accent: #CBAD89;
  --accent-text: #7A5A2E;
  --accent-hover: #B2946E;
  --on-accent: #1F1D1E;
  --euc: #3E7A72;
  --euc-text: #2F5D57;
  --euc-wash: #D7E8E4;
  --success: #2E6B45;
  --warning: #9A5B00;
  --warning-wash: #F7E9D2;
  --error: #A33A32;
  --error-wash: #F7E3E1;
  --info: #3B5A7A;
  --focus-ring: #7A5A2E;

  --tooth-fill: #FFFFFF;
  --tooth-stroke: #5C5654;
  --tooth-root-fill: #F2EDE6;
  --tooth-diseased-fill: #F7E3E1;
  --tooth-diseased-stroke: #A33A32;
  --tooth-restored-fill: #D7E8E4;
  --tooth-restored-stroke: #3E7A72;
  --tooth-closed-stroke: #2E6B45;
  --tooth-selected-stroke: #7A5A2E;
  --tooth-absent: #8C8480;

  --shadow-sm: 0 1px 2px rgb(31 29 30 / .07), 0 1px 1px rgb(31 29 30 / .04);
  --shadow-md: 0 6px 22px rgb(31 29 30 / .10), 0 2px 6px rgb(31 29 30 / .06);
  --radius: 10px;
  --radius-sm: 6px;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1819;
    --surface: #2E2C2D;
    --surface-raised: #363233;
    --border: #504C4B;
    --border-strong: #8C8480;
    --text: #EAE4DC;
    --text-muted: #A79E96;
    --text-disabled: #7A726C;
    --accent: #CBAD89;
    --accent-text: #E3C9A6;
    --accent-hover: #E3C9A6;
    --on-accent: #1A1819;
    --euc: #7FB3AA;
    --euc-text: #7FB3AA;
    --euc-wash: #24413E;
    --success: #6FBF8E;
    --warning: #E8A33D;
    --warning-wash: #4A3413;
    --error: #E88178;
    --error-wash: #5A2B27;
    --info: #8FB2D6;
    --focus-ring: #E3C9A6;
    --tooth-fill: #363233;
    --tooth-stroke: #A79E96;
    --tooth-root-fill: #2E2C2D;
    --tooth-diseased-fill: #5A2B27;
    --tooth-diseased-stroke: #E88178;
    --tooth-restored-fill: #24413E;
    --tooth-restored-stroke: #7FB3AA;
    --tooth-closed-stroke: #6FBF8E;
    --tooth-selected-stroke: #E3C9A6;
    --tooth-absent: #7A726C;
    --shadow-sm: 0 1px 2px rgb(0 0 0 / .4);
    --shadow-md: 0 8px 26px rgb(0 0 0 / .45), 0 2px 6px rgb(0 0 0 / .3);
  }
}
:root[data-theme="dark"] {
  --bg: #1A1819;
  --surface: #2E2C2D;
  --surface-raised: #363233;
  --border: #504C4B;
  --border-strong: #8C8480;
  --text: #EAE4DC;
  --text-muted: #A79E96;
  --text-disabled: #7A726C;
  --accent: #CBAD89;
  --accent-text: #E3C9A6;
  --accent-hover: #E3C9A6;
  --on-accent: #1A1819;
  --euc: #7FB3AA;
  --euc-text: #7FB3AA;
  --euc-wash: #24413E;
  --success: #6FBF8E;
  --warning: #E8A33D;
  --warning-wash: #4A3413;
  --error: #E88178;
  --error-wash: #5A2B27;
  --info: #8FB2D6;
  --focus-ring: #E3C9A6;
  --tooth-fill: #363233;
  --tooth-stroke: #A79E96;
  --tooth-root-fill: #2E2C2D;
  --tooth-diseased-fill: #5A2B27;
  --tooth-diseased-stroke: #E88178;
  --tooth-restored-fill: #24413E;
  --tooth-restored-stroke: #7FB3AA;
  --tooth-closed-stroke: #6FBF8E;
  --tooth-selected-stroke: #E3C9A6;
  --tooth-absent: #7A726C;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / .4);
  --shadow-md: 0 8px 26px rgb(0 0 0 / .45), 0 2px 6px rgb(0 0 0 / .3);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.012em; }

/* ── Szkielet ───────────────────────────────────────────────────────────── */
.app { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; }
.brand b { display: block; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.brand span { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .09em; }

.patient { display: flex; align-items: baseline; gap: 10px 12px; flex-wrap: wrap; min-width: 0; }
.patient-name { font-weight: 600; }
.patient-meta { font-family: var(--mono); font-size: 12px; color: var(--text-muted); }
.alert-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 8px; border-radius: 999px;
  background: var(--error-wash); color: var(--error);
  border: 1px solid var(--error);
  font-size: 12px; font-weight: 600;
}
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.seg { display: inline-flex; background: var(--surface-raised); border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
.seg button {
  border: 0; background: none; cursor: pointer; border-radius: 999px;
  padding: 5px 11px; font-size: 13px; color: var(--text-muted);
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }

.icon-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
  padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--text-muted);
}
.icon-btn:hover { border-color: var(--border-strong); color: var(--text); }
.icon-btn[aria-pressed="true"] { background: var(--surface-raised); color: var(--accent-text); border-color: var(--accent); }

/* ── Obszar roboczy ─────────────────────────────────────────────────────── */
.workspace { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 16px; align-items: start; flex: 1; min-width: 0; }
.workspace > * { min-width: 0; }
.panel { min-width: 0; }
.app { overflow-x: clip; }
@media (min-width: 1260px) {
  .workspace { grid-template-columns: minmax(0, 1fr) 400px; padding: 20px; gap: 20px; }
}

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.panel-head {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
}
.panel-head h2 { font-size: 15px; font-weight: 600; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); font-weight: 600; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.chip {
  border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
  padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--text-muted);
}
.chip[aria-pressed="true"] { background: var(--surface-raised); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }

/* pasek zaznaczania */
.selbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  background: var(--surface-raised);
  border-radius: 0;
}
.selbar .count {
  font-family: var(--mono); font-size: 12px; font-weight: 600;
  padding: 3px 9px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}
.selbar .count.on { border-color: var(--accent); color: var(--accent-text); }
.quick { display: flex; gap: 4px; flex-wrap: wrap; }
.quick button {
  border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-sm);
  padding: 4px 9px; font-size: 12px; cursor: pointer; color: var(--text-muted); white-space: nowrap;
}
.quick button:hover { border-color: var(--accent); color: var(--accent-text); }
.selbar .spacer { margin-left: auto; }

/* ── Łuk zębowy ─────────────────────────────────────────────────────────── */
.arch-wrap { overflow-x: auto; overscroll-behavior-x: contain; padding: 4px 12px 12px; }
.arch { display: block; min-width: 760px; width: 100%; height: auto; touch-action: pan-x pan-y; }

.tooth { cursor: pointer; }
.tooth .crown, .tooth .root { transition: fill .12s ease, stroke .12s ease; }
@media (prefers-reduced-motion: reduce) { .tooth .crown, .tooth .root { transition: none; } }
.tooth .root { fill: var(--tooth-root-fill); stroke: var(--tooth-stroke); stroke-width: 1.1; }
.tooth .crown { fill: var(--tooth-fill); stroke: var(--tooth-stroke); stroke-width: 1.3; }
.tooth .canal { stroke: var(--tooth-stroke); stroke-width: 1.1; opacity: .55; fill: none; stroke-linecap: round; }
.tooth:hover .crown { stroke: var(--accent-hover); }
.tooth .hit { fill: transparent; }

.tooth.is-diseased .crown { fill: var(--tooth-diseased-fill); stroke: var(--tooth-diseased-stroke); }
.tooth.is-restored .crown { fill: var(--tooth-restored-fill); stroke: var(--tooth-restored-stroke); }
.tooth.is-both .crown { fill: var(--tooth-diseased-fill); stroke: var(--tooth-diseased-stroke); }
.tooth.is-absent .crown, .tooth.is-absent .root { fill: none; stroke: var(--tooth-absent); stroke-dasharray: 3 3; }
.tooth.is-absent .canal { display: none; }
.tooth.is-unerupted .crown, .tooth.is-unerupted .root { opacity: .45; stroke-dasharray: 4 3; }
.tooth.is-selected .crown { stroke: var(--tooth-selected-stroke); stroke-width: 2.4; }
.tooth.is-selected .root { stroke: var(--tooth-selected-stroke); }
.tooth-label {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  fill: var(--text-muted); text-anchor: middle; font-variant-numeric: tabular-nums;
  pointer-events: none; user-select: none;
}
.tooth-label.is-sel { fill: var(--accent-text); font-weight: 700; }
.midline { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 4; }
.quad-label {
  font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  fill: var(--text-disabled); text-anchor: middle; pointer-events: none;
}
.zone { stroke: var(--tooth-stroke); stroke-width: .7; fill: none; opacity: .5; }
.zone.filled { opacity: 1; stroke-width: .9; }
.zone.f-diag { fill: url(#hatchDiag); stroke: var(--tooth-diseased-stroke); }
.zone.f-rest { fill: var(--tooth-restored-stroke); stroke: var(--tooth-restored-stroke); }
.zone.f-done { fill: none; stroke: var(--tooth-closed-stroke); stroke-width: 1.4; }
.absent-cross { display: none; }
.absent-cross path { stroke: var(--tooth-absent); stroke-width: 1.6; stroke-linecap: round; fill: none; }
.tooth.is-absent .absent-cross { display: block; }
.tooth.is-absent .zones { display: none !important; }
.canal-flag { fill: var(--warning); }

/* przegląd */
.overview { border-top: 1px solid var(--border); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.ov-stats { display: flex; gap: 8px; flex-wrap: wrap; }
.ov-stat {
  display: flex; align-items: baseline; gap: 7px;
  border: 1px solid var(--border); border-left-width: 3px; border-radius: var(--radius-sm);
  padding: 7px 12px; background: var(--surface-raised);
}
.ov-stat b { font-family: var(--mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.ov-stat span { font-size: 12px; color: var(--text-muted); }
.ov-diag { border-left-color: var(--error); }
.ov-rest { border-left-color: var(--euc); }
.ov-absent { border-left-color: var(--text-disabled); }
.ov-canal { border-left-color: var(--warning); }
.ov-list { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ov-list .eyebrow { margin-right: 2px; }
.ov-tooth {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
  padding: 3px 10px; font-size: 12px; cursor: pointer;
}
.ov-tooth b { font-family: var(--mono); font-weight: 600; }
.ov-tooth:hover { border-color: var(--accent); color: var(--accent-text); }
.ov-tooth .dotm { width: 7px; height: 7px; border-radius: 2px; }

/* legenda */
.legend { border-top: 1px solid var(--border); }
.legend summary { padding: 10px 16px; cursor: pointer; font-size: 13px; color: var(--text-muted); font-weight: 500; }
.legend summary::marker { color: var(--accent); }
.legend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px 16px; padding: 4px 16px 16px; }
.legend-item { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--text-muted); }
.legend-item svg { flex: none; }

/* ── Inspektor ──────────────────────────────────────────────────────────── */
.inspector { display: flex; flex-direction: column; gap: 14px; }
.inspector .panel { display: block; }
.insp-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }

.tooth-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.fdi { font-family: var(--mono); font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
.tooth-anat { font-size: 13px; color: var(--text-muted); }

.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 400px) { .detail-grid { grid-template-columns: 1fr; } }
.detail-card { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; }
.detail-card h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }

.surface-map { width: 100%; height: auto; display: block; }
.surface-map .sf { cursor: pointer; stroke: var(--tooth-stroke); stroke-width: 1; fill: var(--tooth-fill); }
.surface-map .sf:hover { fill: var(--surface-raised); }
.surface-map .sf.picked { fill: var(--accent); stroke: var(--accent-text); stroke-width: 1.6; }
.surface-map .sf.has-diag { fill: url(#hatchDiag2); stroke: var(--tooth-diseased-stroke); }
.surface-map .sf.has-rest { fill: var(--tooth-restored-fill); stroke: var(--tooth-restored-stroke); }
.surface-map .sf.picked.has-diag, .surface-map .sf.picked.has-rest { stroke: var(--accent-text); stroke-width: 2; }
.surface-map .sf-label { font-family: var(--mono); font-size: 9px; fill: var(--text-muted); text-anchor: middle; pointer-events: none; font-weight: 600; }
.surface-map .sf.picked + .sf-label { fill: var(--on-accent); }

.canal-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
.stepper button { width: 28px; height: 28px; border: 0; background: none; cursor: pointer; color: var(--accent-text); font-size: 16px; line-height: 1; }
.stepper button:disabled { color: var(--text-disabled); cursor: not-allowed; }
.stepper .val { min-width: 26px; text-align: center; font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.canal-default { font-size: 11.5px; color: var(--text-muted); }
.canal-default.changed { color: var(--warning); font-weight: 600; }
.canal-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.canal-list li { display: flex; align-items: center; gap: 7px; font-size: 12px; }
.canal-list button {
  flex: 1; text-align: left; border: 1px solid var(--border); background: var(--surface);
  border-radius: var(--radius-sm); padding: 4px 8px; cursor: pointer; font-size: 12px;
}
.canal-list button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; }
.canal-list .cn { font-family: var(--mono); color: var(--text-muted); font-size: 11px; }

/* formularz */
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
.field input[type="text"], .field input[type="date"], .field select, .field textarea {
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  padding: 8px 10px; width: 100%;
}
.field textarea { resize: vertical; min-height: 60px; }
.search-wrap { position: relative; }
.dx-list { list-style: none; margin: 6px 0 0; padding: 0; max-height: 232px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
.dx-group { padding: 6px 10px 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-muted); background: var(--surface-raised); position: sticky; top: 0; font-weight: 600; }
.dx-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; cursor: pointer; border-bottom: 1px solid var(--border); }
.dx-item:last-child { border-bottom: 0; }
.dx-item:hover { background: var(--surface-raised); }
.dx-item[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.dx-name { flex: 1; font-size: 13px; }
.dx-meta { font-family: var(--mono); font-size: 10.5px; color: var(--text-muted); }
.dx-item[aria-pressed="true"] .dx-meta { color: var(--on-accent); }
.scope-tag {
  font-size: 10px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600;
  padding: 1px 6px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap;
}
.scope-surface { color: var(--info); }
.scope-tooth { color: var(--accent-text); }
.scope-root { color: var(--euc-text); }
.scope-perio { color: var(--warning); }
.layer-dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.layer-diag { background: var(--error); }
.layer-rest { background: var(--euc); }

.hint { font-size: 12px; color: var(--text-muted); display: flex; gap: 6px; align-items: flex-start; }
.hint.block { color: var(--warning); font-weight: 500; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 1px solid transparent; border-radius: var(--radius-sm); padding: 9px 16px;
  font-weight: 600; font-size: 13.5px; cursor: pointer;
}
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { background: var(--surface-raised); color: var(--text-disabled); cursor: not-allowed; }
.btn-ghost { background: none; border-color: var(--border-strong); color: var(--text-muted); }
.btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }

/* wpisy */
.findings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.finding {
  border: 1px solid var(--border); border-left: 3px solid var(--error);
  border-radius: var(--radius-sm); padding: 9px 11px; background: var(--surface);
}
.finding.rest { border-left-color: var(--euc); }
.finding.done { border-left-color: var(--success); opacity: .8; }
.finding.stale { border-left-color: var(--text-disabled); opacity: .65; }
.finding-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.finding-name { font-weight: 600; font-size: 13.5px; }
.finding-loc { font-family: var(--mono); font-size: 11.5px; color: var(--accent-text); }
.finding-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
.finding-note { font-size: 12.5px; margin-top: 5px; padding-left: 8px; border-left: 2px solid var(--border); color: var(--text-muted); }
.finding-actions { display: flex; gap: 6px; margin-top: 7px; }
.link-btn { border: 0; background: none; color: var(--accent-text); font-size: 12px; font-weight: 600; cursor: pointer; padding: 2px 0; text-decoration: underline; text-underline-offset: 2px; }
.status-pill { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; padding: 1px 6px; border-radius: 999px; }
.pill-active { background: var(--error-wash); color: var(--error); }
.pill-done { background: var(--euc-wash); color: var(--success); }

<script>
(() => {
'use strict';

/* ══ SŁOWNIK ROZPOZNAŃ (FR-011..FR-020) ═══════════════════════════════════
   scope: surface | tooth | root | perio   ·   layer: diagnosis | existing   */
const CAT = [
  ['hard',  'Twarde tkanki zęba'],
  ['pulp',  'Miazga i tkanki okołowierzchołkowe'],
  ['trauma','Urazy i pęknięcia'],
  ['noncar','Ubytki niepróchnicowego pochodzenia'],
  ['perio', 'Przyzębie i tkanki miękkie'],
  ['erupt', 'Wyrzynanie i braki zębowe'],
  ['rest',  'Stan istniejący i uzupełnienia'],
  ['other', 'Poza słownikiem'],
];
const DX = [
  { code:'K02.0a', name:'Próchnica początkowa (plamka)', cat:'hard', scope:'surface', layer:'diagnosis', icd:'K02.0' },
  { code:'K02.0b', name:'Próchnica szkliwa',             cat:'hard', scope:'surface', layer:'diagnosis', icd:'K02.0' },
  { code:'K02.1',  name:'Próchnica zębiny',              cat:'hard', scope:'surface', layer:'diagnosis', icd:'K02.1' },
  { code:'K02.1d', name:'Próchnica głęboka',             cat:'hard', scope:'surface', layer:'diagnosis', icd:'K02.1' },
  { code:'K02.1s', name:'Próchnica wtórna',              cat:'hard', scope:'surface', layer:'diagnosis', icd:'K02.1' },
  { code:'K02.2',  name:'Próchnica korzenia',            cat:'hard', scope:'surface', layer:'diagnosis', icd:'K02.2' },
  { code:'K04.0r', name:'Zapalenie miazgi odwracalne',   cat:'pulp', scope:'tooth',   layer:'diagnosis', icd:'K04.0' },
  { code:'K04.0i', name:'Zapalenie miazgi nieodwracalne',cat:'pulp', scope:'tooth',   layer:'diagnosis', icd:'K04.0' },
  { code:'K04.1',  name:'Martwica miazgi',               cat:'pulp', scope:'tooth',   layer:'diagnosis', icd:'K04.1' },
  { code:'K04.4',  name:'Zapalenie tkanek okołowierzchołkowych', cat:'pulp', scope:'root', layer:'diagnosis', icd:'K04.4', sev:['ostre','przewlekłe'] },
  { code:'K04.7',  name:'Ropień okołowierzchołkowy',     cat:'pulp', scope:'root',    layer:'diagnosis', icd:'K04.7' },
  { code:'K04.8',  name:'Torbiel korzeniowa',            cat:'pulp', scope:'root',    layer:'diagnosis', icd:'K04.8' },
  { code:'S02.51', name:'Złamanie korony',               cat:'trauma', scope:'surface', layer:'diagnosis', icd:'S02.51' },
  { code:'S02.53', name:'Złamanie korzenia',             cat:'trauma', scope:'root',    layer:'diagnosis', icd:'S02.53' },
  { code:'K03.81', name:'Pęknięcie zęba',                cat:'trauma', scope:'tooth',   layer:'diagnosis', icd:'K03.81' },
  { code:'S02.52', name:'Odłamanie fragmentu korony',    cat:'trauma', scope:'surface', layer:'diagnosis', icd:'S02.52' },
  { code:'K03.0',  name:'Starcie patologiczne (atrycja)',cat:'noncar', scope:'surface', layer:'diagnosis', icd:'K03.0', sev:['1°','2°','3°','4°'] },
  { code:'K03.1',  name:'Abrazja',                       cat:'noncar', scope:'surface', layer:'diagnosis', icd:'K03.1' },
  { code:'K03.2',  name:'Erozja',                        cat:'noncar', scope:'surface', layer:'diagnosis', icd:'K03.2' },
  { code:'K03.19', name:'Abfrakcja',                     cat:'noncar', scope:'surface', layer:'diagnosis' },
  { code:'K03.8',  name:'Nadwrażliwość zębiny',          cat:'noncar', scope:'surface', layer:'diagnosis', icd:'K03.8' },
  { code:'K05.1',  name:'Zapalenie dziąsła',             cat:'perio',  scope:'perio',   layer:'diagnosis', icd:'K05.1' },
  { code:'K05.3',  name:'Zapalenie przyzębia',           cat:'perio',  scope:'perio',   layer:'diagnosis', icd:'K05.3', sev:['I°','II°','III°','IV°'] },
  { code:'K06.0',  name:'Recesja dziąsłowa',             cat:'perio',  scope:'perio',   layer:'diagnosis', icd:'K06.0', sev:['klasa I','klasa II','klasa III','klasa IV'] },
  { code:'K03.6',  name:'Kamień nazębny',                cat:'perio',  scope:'perio',   layer:'diagnosis', icd:'K03.6' },
  { code:'K05.31', name:'Kieszonka przyzębna',           cat:'perio',  scope:'perio',   layer:'diagnosis', sev:['4–5 mm','6–7 mm','≥8 mm'] },
  { code:'K01.0',  name:'Ząb zatrzymany',                cat:'erupt',  scope:'tooth',   layer:'diagnosis', icd:'K01.0', presence:'unerupted' },
  { code:'K00.6',  name:'Ząb niewyrznięty',              cat:'erupt',  scope:'tooth',   layer:'diagnosis', icd:'K00.6', presence:'unerupted' },
  { code:'K07.3',  name:'Nieprawidłowe ustawienie / rotacja', cat:'erupt', scope:'tooth', layer:'diagnosis', icd:'K07.3' },
  { code:'K00.0',  name:'Wrodzony brak zęba (agenezja)', cat:'erupt',  scope:'tooth',   layer:'diagnosis', icd:'K00.0', presence:'agenesis', absentOk:true },
  { code:'EXTR',   name:'Ząb usunięty (stan po ekstrakcji)', cat:'erupt', scope:'tooth', layer:'existing', presence:'extracted', absentOk:true },
  { code:'FILL',   name:'Wypełnienie',                   cat:'rest', scope:'surface', layer:'existing' },
  { code:'FILLT',  name:'Wypełnienie tymczasowe',        cat:'rest', scope:'surface', layer:'existing' },
  { code:'SEAL',   name:'Uszczelnienie bruzd (lak)',     cat:'rest', scope:'surface', layer:'existing' },
  { code:'ENDO',   name:'Leczenie kanałowe (stan po)',   cat:'rest', scope:'root',   layer:'existing', sev:['wypełniony','niedopełniony','przepełniony','nieodnaleziony'] },
  { code:'POST',   name:'Wkład koronowo-korzeniowy',     cat:'rest', scope:'root',   layer:'existing' },
  { code:'CROWN',  name:'Korona protetyczna',            cat:'rest', scope:'tooth',  layer:'existing' },
  { code:'VENEER', name:'Licówka',                       cat:'rest', scope:'surface',layer:'existing' },
  { code:'PONTIC', name:'Przęsło mostu',                 cat:'rest', scope:'tooth',  layer:'existing', absentOk:true, absentOnly:true },
  { code:'IMPL',   name:'Implant',                       cat:'rest', scope:'tooth',  layer:'existing', absentOk:true, absentOnly:true },
  { code:'ABUT',   name:'Ząb filarowy protezy',          cat:'rest', scope:'tooth',  layer:'existing' },
  { code:'OTHER',  name:'Inne rozpoznanie (wymaga opisu)',cat:'other',scope:'ask',   layer:'diagnosis', needsNote:true },
];
const DXMAP = Object.fromEntries(DX.map(d => [d.code, d]));

/* ══ ANATOMIA ═════════════════════════════════════════════════════════════ */
const PERM_UPPER = [18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
const PERM_LOWER = [48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const DEC_UPPER  = [55,54,53,52,51,61,62,63,64,65];
const DEC_LOWER  = [85,84,83,82,81,71,72,73,74,75];
/* uzębienie mieszane ~7–9 lat: stałe szóstki i siekacze, mleczne 3–5 */
const MIXED_UPPER = [16,55,54,53,12,11,21,22,63,64,65,26];
const MIXED_LOWER = [46,85,84,83,42,41,31,32,73,74,75,36];

const POS_NAME = { 1:'siekacz przyśrodkowy', 2:'siekacz boczny', 3:'kieł',
  4:'pierwszy przedtrzonowiec', 5:'drugi przedtrzonowiec',
  6:'pierwszy trzonowiec', 7:'drugi trzonowiec', 8:'trzeci trzonowiec (ząb mądrości)' };
const POS_NAME_DEC = { 1:'siekacz przyśrodkowy mleczny', 2:'siekacz boczny mleczny', 3:'kieł mleczny',
  4:'pierwszy trzonowiec mleczny', 5:'drugi trzonowiec mleczny' };

function meta(fdi) {
  const q = Math.floor(fdi / 10), p = fdi % 10;
  const deciduous = q >= 5;
  const upper = q === 1 || q === 2 || q === 5 || q === 6;
  const right = q === 1 || q === 4 || q === 5 || q === 8;   // strona pacjenta
  const type = deciduous ? (p <= 2 ? 'incisor' : p === 3 ? 'canine' : 'molar')
                         : (p <= 2 ? 'incisor' : p === 3 ? 'canine' : p <= 5 ? 'premolar' : 'molar');
  const anterior = p <= 3;
  let roots, canals;
  if (deciduous) { roots = p <= 3 ? 1 : (upper ? 3 : 2); canals = p <= 3 ? 1 : (upper ? 3 : 2); }
  else if (p <= 3) { roots = 1; canals = 1; }
  else if (p <= 5) { roots = (upper && p === 4) ? 2 : 1; canals = (upper && p === 4) ? 2 : 1; }
  else { roots = upper ? 3 : 2; canals = 3; }
  const surfaces = ['M','D','B','L', anterior ? 'I' : 'O'];
  const name = (deciduous ? POS_NAME_DEC : POS_NAME)[p];
  const quad = (upper ? 'górny ' : 'dolny ') + (right ? 'prawy' : 'lewy');
  const widths = deciduous
    ? (upper ? {1:19,2:17,3:18,4:23,5:25} : {1:15,2:17,3:18,4:22,5:24})
    : (upper ? {1:23,2:19,3:20,4:21,5:21,6:27,7:26,8:24}
             : {1:16,2:17,3:19,4:20,5:21,6:27,7:26,8:24});
  return { fdi, q, p, deciduous, upper, right, type, anterior, roots, canals, surfaces,
           name, quad, label: `${name} ${quad}`, width: widths[p] };
}
const SURFACE_NAME = (fdi, s) => {
  const m = meta(fdi);
  return { M:'mezjalna', D:'dystalna',
    B: m.anterior ? 'wargowa' : 'policzkowa',
    L: m.upper ? 'podniebienna' : 'językowa',
    O:'żująca', I:'sieczna' }[s];
};
function canalNames(fdi) {
  const m = meta(fdi), n = state.teeth[fdi].canals;
  if (n === 1) return ['kanał główny'];
  if (m.type === 'premolar') return ['policzkowy', 'podniebienny'].slice(0, n);
  const base = m.upper
    ? ['policzkowy bliższy (MB)', 'policzkowy dalszy (DB)', 'podniebienny (P)', 'policzkowy bliższy drugi (MB2)']
    : ['bliższy policzkowy (MB)', 'bliższy językowy (ML)', 'dalszy (D)', 'dalszy językowy (DL)'];
  const out = base.slice(0, n);
  while (out.length < n) out.push('kanał dodatkowy ' + (out.length + 1));
  return out;
}

/* ══ STAN ═════════════════════════════════════════════════════════════════ */
const state = {
  dentition: 'permanent',
  layer: 'all',
  selection: new Set(),
  surfaces: new Set(),
  canal: null,
  dx: null,
  scopeAsk: 'tooth',
  teeth: {},
  seq: 100,
};
[...PERM_UPPER, ...PERM_LOWER, ...DEC_UPPER, ...DEC_LOWER].forEach(fdi => {
  state.teeth[fdi] = { presence: 'present', canals: meta(fdi).canals, canalsDefault: meta(fdi).canals, findings: [] };
});

function addFinding(fdi, o) {
  const f = Object.assign({
    id: 'f' + (state.seq++), tooth: fdi, surfaces: [], canal: null, severity: null, note: '',
    date: o.date || '2026-08-30', author: 'lek. dent. A. Zielińska', role: 'DOCTOR',
    clinical: 'active', record: 'current', supersedes: null,
  }, o);
  f.layer = DXMAP[f.dxCode].layer;
  state.teeth[fdi].findings.push(f);
  const pres = DXMAP[f.dxCode].presence;
  if (pres && f.record === 'current') state.teeth[fdi].presence = pres;
  return f;
}

/* dane wyjściowe — realistyczny przypadek, żeby mockup nie był pusty */
addFinding(36, { dxCode:'K02.1', surfaces:['O','M'], date:'2026-08-30', note:'Ubytek sięgający zębiny, bez objawów ze strony miazgi.' });
addFinding(24, { dxCode:'K02.1s', surfaces:['D'], date:'2026-06-11' });
addFinding(11, { dxCode:'S02.51', surfaces:['B'], date:'2026-02-03', note:'Uraz sportowy, brzeg sieczny.' });
addFinding(16, { dxCode:'ENDO', canal:2, severity:'wypełniony', date:'2025-11-20', author:'lek. dent. M. Bąk' });
addFinding(16, { dxCode:'CROWN', date:'2025-12-08', author:'lek. dent. M. Bąk' });
addFinding(26, { dxCode:'FILL', surfaces:['O','M'], date:'2024-09-17', author:'lek. dent. M. Bąk' });
addFinding(46, { dxCode:'EXTR', date:'2023-05-04', author:'lek. dent. M. Bąk' });
addFinding(38, { dxCode:'K01.0', date:'2025-03-22' });
[33,32,31,41,42,43].forEach(t => addFinding(t, { dxCode:'K03.6', date:'2026-08-30', note:'Odcinek przedni dolny — złogi na powierzchniach językowych.' }));
addFinding(37, { dxCode:'K02.0b', surfaces:['O'], date:'2025-01-14', clinical:'closed', closedAt:'2025-02-02' });
state.teeth[16].canals = 4;   // MB2 — liczba inna niż domyślna (FR-065)

/* ══ POMOCNIKI ════════════════════════════════════════════════════════════ */
const f2 = n => Math.round(n * 100) / 100;
const el = (tag, attrs) => {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  return n;
};
const rows = () => state.dentition === 'permanent' ? [PERM_UPPER, PERM_LOWER]
  : state.dentition === 'deciduous' ? [DEC_UPPER, DEC_LOWER]
  : [MIXED_UPPER, MIXED_LOWER];
const visibleTeeth = () => rows().flat();
const current = fdi => state.teeth[fdi].findings.filter(f => f.record === 'current');
const activeF = fdi => current(fdi).filter(f => f.clinical === 'active');
const inLayer = f => state.layer === 'all' || f.layer === (state.layer === 'diagnosis' ? 'diagnosis' : 'existing');

function toothStatus(fdi) {
  const t = state.teeth[fdi];
  if (t.presence === 'extracted' || t.presence === 'agenesis') return 'absent';
  if (t.presence === 'unerupted') return 'unerupted';
  const a = activeF(fdi).filter(inLayer);
  const hasDiag = a.some(f => f.layer === 'diagnosis');
  const hasRest = a.some(f => f.layer === 'existing');
  if (hasDiag && hasRest) return 'both';
  if (hasDiag) return 'diseased';
  if (hasRest) return 'restored';
  return 'healthy';
}

/* ══ RYSOWANIE ŁUKU (FR-001, FR-001a, FR-002, FR-026, FR-029) ═════════════ */
const VW = 1000, VH = 352, MARGIN = 26, GAP = 5, CURVE = 14, TILT = 6;
const Y_UPPER = 150, Y_LOWER = 202, Y_LABEL_U = 168, Y_LABEL_L = 191;
const RATIO = {
  incisor:  { crown: 1.12, root: 1.15, cusps: 1, bump: 0.03 },
  canine:   { crown: 1.20, root: 1.35, cusps: 1, bump: 0.10 },
  premolar: { crown: 1.00, root: 1.15, cusps: 2, bump: 0.09 },
  molar:    { crown: 0.88, root: 0.92, cusps: 3, bump: 0.10 },
};

function crownPath(w, h, cusps, dir, bump) {
  const Y = v => f2(dir * v);
  const nk = w * 0.40, mx = w * 0.50, inset = w * 0.10;
  const ex = w / 2 - inset;
  let d = `M ${f2(-nk)} ${Y(h)}`;
  d += ` C ${f2(-mx)} ${Y(h * 0.74)}, ${f2(-mx)} ${Y(h * 0.28)}, ${f2(-ex)} ${Y(h * 0.05)}`;
  const seg = (2 * ex) / cusps;
  let cx = -ex;
  for (let i = 0; i < cusps; i++) {
    const nx = cx + seg;
    d += ` Q ${f2(cx + seg / 2)} ${Y(-h * bump)}, ${f2(nx)} ${Y(h * 0.05)}`;
    cx = nx;
  }
  d += ` C ${f2(mx)} ${Y(h * 0.28)}, ${f2(mx)} ${Y(h * 0.74)}, ${f2(nk)} ${Y(h)} Z`;
  return d;
}
function rootGeometry(w, crownH, rootH, n, canals, dir) {
  const Y = v => f2(dir * v);
  const CW = w * 0.80, slot = CW / n;
  const yN = crownH, yA = crownH + rootH, yF = crownH + rootH * 0.34;
  const splay = n === 1 ? 1 : 1.18;
  const centers = [], tips = [];
  for (let i = 0; i < n; i++) { const c = -CW / 2 + slot * (i + 0.5); centers.push(c); tips.push(c * splay); }
  const aw = Math.max(Math.min(slot * 0.22, w * 0.07), w * 0.035);

  let d = `M ${f2(-CW / 2)} ${Y(yN)}`, fromX = -CW / 2, fromY = yN;
  for (let i = 0; i < n; i++) {
    const t = tips[i];
    d += ` C ${f2(fromX * 1.02)} ${Y(fromY + (yA - fromY) * 0.42)}, ${f2(t - aw * 1.9)} ${Y(yA - rootH * 0.26)}, ${f2(t - aw)} ${Y(yA)}`;
    d += ` Q ${f2(t)} ${Y(yA + rootH * 0.05)}, ${f2(t + aw)} ${Y(yA)}`;
    if (i < n - 1) {
      const fx = (centers[i] + centers[i + 1]) / 2;
      d += ` C ${f2(t + aw * 1.9)} ${Y(yA - rootH * 0.26)}, ${f2(fx)} ${Y(yF + rootH * 0.24)}, ${f2(fx)} ${Y(yF)}`;
      fromX = fx; fromY = yF;
    } else {
      d += ` C ${f2(t + aw * 1.9)} ${Y(yA - rootH * 0.26)}, ${f2(CW / 2 * 1.02)} ${Y(yN + (yA - yN) * 0.42)}, ${f2(CW / 2)} ${Y(yN)}`;
    }
  }
  d += ' Z';

  const per = centers.map(() => 0);
  for (let i = 0; i < canals; i++) per[i % n]++;
  const lines = [];
  centers.forEach((c, ri) => {
    for (let k = 0; k < per[ri]; k++) {
      const off = per[ri] === 1 ? 0 : (k - (per[ri] - 1) / 2) * slot * 0.24;
      lines.push(`M ${f2(c + off)} ${Y(yN + rootH * 0.10)} L ${f2(tips[ri] + off * 0.4)} ${Y(yA - rootH * 0.14)}`);
    }
  });
  return { d, lines, apexY: yA };
}
/* glif 5-strefowy w projekcji okluzyjnej: góra = przedsionkowa, dół = językowa,
   boki = mezjalna/dystalna zależnie od strony łuku (FR-026) */
function zoneShapes(s, right) {
  const o = s / 2, i = s * 0.21;
  const mesialLeft = !right;      // ćwiartki 2 i 3 → mezjalna po lewej stronie rysunku
  return [
    { key: 'B', d: `M ${-o} ${-o} L ${o} ${-o} L ${i} ${-i} L ${-i} ${-i} Z` },
    { key: 'L', d: `M ${-o} ${o} L ${o} ${o} L ${i} ${i} L ${-i} ${i} Z` },
    { key: mesialLeft ? 'M' : 'D', d: `M ${-o} ${-o} L ${-i} ${-i} L ${-i} ${i} L ${-o} ${o} Z` },
    { key: mesialLeft ? 'D' : 'M', d: `M ${o} ${-o} L ${i} ${-i} L ${i} ${i} L ${o} ${o} Z` },
    { key: 'C', d: `M ${-i} ${-i} L ${i} ${-i} L ${i} ${i} L ${-i} ${i} Z` },
  ];
}

const archSvg = document.getElementById('arch');

function renderArch() {
  archSvg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
  archSvg.textContent = '';
  const g = el('g', {});
  archSvg.appendChild(g);

  g.appendChild(el('line', { x1: VW / 2, y1: 8, x2: VW / 2, y2: VH - 8, class: 'midline' }));
  const [upper, lower] = rows();
  [[upper, true], [lower, false]].forEach(([list, isUpper]) => {
    const widths = list.map(t => meta(t).width);
    const total = widths.reduce((a, b) => a + b, 0) + GAP * (list.length - 1);
    const scale = (VW - 2 * MARGIN) / total;
    let x = MARGIN;
    list.forEach((fdi, idx) => {
      const m = meta(fdi), w = widths[idx] * scale, pitch = w + GAP * scale;
      const cx = x + w / 2;
      x += w + GAP * scale;
      const t = (cx - VW / 2) / ((VW - 2 * MARGIN) / 2);
      const dir = isUpper ? -1 : 1;
      const yBase = (isUpper ? Y_UPPER : Y_LOWER) + dir * CURVE * t * t;
      const rot = (isUpper ? 1 : -1) * t * TILT;
      g.appendChild(drawTooth(fdi, m, w, pitch, cx, yBase, dir, rot));
      const ly = isUpper ? Y_LABEL_U : Y_LABEL_L;
      const lbl = el('text', { x: f2(cx), y: ly, class: 'tooth-label', 'data-label': fdi });
      lbl.textContent = fdi;
      g.appendChild(lbl);
    });
    const half = (VW - 2 * MARGIN) / 4;
    const qs = isUpper ? ['ćwiartka 1 · prawa górna', 'ćwiartka 2 · lewa górna']
                       : ['ćwiartka 4 · prawa dolna', 'ćwiartka 3 · lewa dolna'];
    g.appendChild(Object.assign(el('text', { x: MARGIN + half, y: isUpper ? 14 : VH - 4, class: 'quad-label' }), { textContent: qs[0] }));
    g.appendChild(Object.assign(el('text', { x: VW - MARGIN - half, y: isUpper ? 14 : VH - 4, class: 'quad-label' }), { textContent: qs[1] }));
  });
  syncArchClasses();
}

function drawTooth(fdi, m, w, pitch, cx, yBase, dir, rot) {
  const r = RATIO[m.type];
  const crownH = w * r.crown, rootH = w * r.root;
  const t = state.teeth[fdi];
  const grp = el('g', {
    class: 'tooth', transform: `translate(${f2(cx)} ${f2(yBase)}) rotate(${f2(rot)})`,
    'data-fdi': fdi, tabindex: 0, role: 'button',
  });
  const rg = rootGeometry(w, crownH, rootH, m.roots, t.canals, dir);
  grp.appendChild(el('path', { d: rg.d, class: 'root' }));
  rg.lines.forEach(d => grp.appendChild(el('path', { d, class: 'canal' })));
  grp.appendChild(el('path', { d: crownPath(w, crownH, r.cusps, dir, r.bump), class: 'crown' }));

  const zg = el('g', { class: 'zones', transform: `translate(0 ${f2(dir * crownH * 0.5)})` });
  const s = Math.min(w * 0.44, crownH * 0.46);
  zoneShapes(s, m.right).forEach(z => zg.appendChild(el('path', { d: z.d, class: 'zone', 'data-zone': z.key })));
  grp.appendChild(zg);

  const xs = w * 0.30, xc = f2(dir * crownH * 0.5);
  const cross = el('g', { class: 'absent-cross', transform: `translate(0 ${xc})` });
  cross.appendChild(el('path', { d: `M ${f2(-xs)} ${f2(-xs)} L ${f2(xs)} ${f2(xs)} M ${f2(xs)} ${f2(-xs)} L ${f2(-xs)} ${f2(xs)}` }));
  grp.appendChild(cross);
  if (t.canals !== t.canalsDefault) {
    grp.appendChild(el('circle', { cx: f2(w * 0.40), cy: f2(dir * (crownH + rootH * 0.70)), r: 3.6, class: 'canal-flag' }));
  }
  const yTop = dir < 0 ? -(crownH + rootH) - 6 : -8;
  grp.appendChild(el('rect', { class: 'hit', x: f2(-pitch / 2), y: f2(yTop), width: f2(pitch), height: f2(crownH + rootH + 14) }));
  return grp;
}

/* aktualizacja klas bez przerysowywania geometrii */
function syncArchClasses() {
  archSvg.querySelectorAll('.tooth').forEach(g => {
    const fdi = +g.dataset.fdi, t = state.teeth[fdi], st = toothStatus(fdi);
    g.classList.toggle('is-diseased', st === 'diseased' || st === 'both');
    g.classList.toggle('is-restored', st === 'restored');
    g.classList.toggle('is-absent', st === 'absent');
    g.classList.toggle('is-unerupted', st === 'unerupted');
    g.classList.toggle('is-selected', state.selection.has(fdi));
    g.classList.toggle('is-flagged', t.canals !== t.canalsDefault);
    const surf = {};
    current(fdi).filter(inLayer).forEach(f => (f.surfaces || []).forEach(s => {
      const key = (s === 'O' || s === 'I') ? 'C' : s;
      const rank = f.clinical === 'closed' ? 1 : f.layer === 'diagnosis' ? 3 : 2;
      if (!surf[key] || surf[key] < rank) surf[key] = rank;
    }));
    const picked = state.selection.has(fdi) ? state.surfaces : new Set();
    const zg = g.querySelector('.zones');
    let any = false;
    zg.querySelectorAll('.zone').forEach(z => {
      const k = z.dataset.zone;
      const mine = k === 'C' ? (surf.C || 0) : (surf[k] || 0);
      const isPicked = picked.has(k === 'C' ? (meta(fdi).anterior ? 'I' : 'O') : k);
      z.classList.toggle('filled', mine > 0);
      z.classList.toggle('f-diag', mine === 3);
      z.classList.toggle('f-rest', mine === 2);
      z.classList.toggle('f-done', mine === 1);
      z.style.stroke = isPicked ? 'var(--tooth-selected-stroke)' : '';
      z.style.strokeWidth = isPicked ? '1.8' : '';
      if (mine > 0 || isPicked) any = true;
    });
    zg.style.display = (any || state.selection.has(fdi)) ? '' : 'none';
    const names = [`ząb ${fdi}`, meta(fdi).label];
    const act = activeF(fdi);
    names.push(act.length ? act.map(f => DXMAP[f.dxCode].name + (f.surfaces.length ? ' — ' + f.surfaces.map(s => 'powierzchnia ' + SURFACE_NAME(fdi, s)).join(', ') : '')).join('; ')
                          : (st === 'absent' ? 'brak zęba' : 'bez odnotowanych zmian'));
    names.push(`kanałów: ${t.canals}`);
    g.setAttribute('aria-label', names.join(', '));
    g.setAttribute('aria-pressed', state.selection.has(fdi) ? 'true' : 'false');
  });
  archSvg.querySelectorAll('[data-label]').forEach(n => {
    const fdi = +n.dataset.label;
    n.classList.toggle('is-sel', state.selection.has(fdi));
  });
}

/* ══ INSPEKTOR ════════════════════════════════════════════════════════════ */
const inspBody = document.getElementById('inspBody');
const inspHeading = document.getElementById('inspHeading');
const inspMode = document.getElementById('inspMode');
/* polska odmiana liczebników */
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (n === 1) return one;
  if (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) return few;
  return many;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function surfaceMapSvg(fdi) {
  const m = meta(fdi), t = state.teeth[fdi];
  const occ = m.anterior ? 'I' : 'O';
  const mesialLeft = !m.right;
  const S = 168, o = S / 2, i = S * 0.21, cxy = 92;
  const zones = [
    { k: 'B', d: `M ${-o} ${-o} L ${o} ${-o} L ${i} ${-i} L ${-i} ${-i} Z`, lx: 0, ly: -o * 0.72 },
    { k: 'L', d: `M ${-o} ${o} L ${o} ${o} L ${i} ${i} L ${-i} ${i} Z`, lx: 0, ly: o * 0.78 },
    { k: mesialLeft ? 'M' : 'D', d: `M ${-o} ${-o} L ${-i} ${-i} L ${-i} ${i} L ${-o} ${o} Z`, lx: -o * 0.72, ly: 4 },
    { k: mesialLeft ? 'D' : 'M', d: `M ${o} ${-o} L ${i} ${-i} L ${i} ${i} L ${o} ${o} Z`, lx: o * 0.72, ly: 4 },
    { k: occ, d: `M ${-i} ${-i} L ${i} ${-i} L ${i} ${i} L ${-i} ${i} Z`, lx: 0, ly: 4 },
  ];
  const findingsBySurface = {};
  current(fdi).filter(inLayer).forEach(f => (f.surfaces || []).forEach(s => {
    findingsBySurface[s] = f.clinical === 'closed' ? 'done' : f.layer;
  }));
  const parts = zones.map(z => {
    const cls = ['sf'];
    if (state.surfaces.has(z.k)) cls.push('picked');
    if (findingsBySurface[z.k] === 'diagnosis') cls.push('has-diag');
    if (findingsBySurface[z.k] === 'existing') cls.push('has-rest');
    return `<path class="${cls.join(' ')}" d="${z.d}" data-surface="${z.k}" role="button" tabindex="0"
      aria-pressed="${state.surfaces.has(z.k)}" aria-label="powierzchnia ${esc(SURFACE_NAME(fdi, z.k))}"></path>
      <text class="sf-label" x="${z.lx}" y="${z.ly}">${z.k}</text>`;
  }).join('');
  return `<svg class="surface-map" viewBox="0 0 184 184" aria-label="Powierzchnie zęba ${fdi}">
    <g transform="translate(${cxy} ${cxy})">${parts}</g></svg>`;
}

function canalCard(fdi) {
  const t = state.teeth[fdi], names = canalNames(fdi);
  const rootHits = {};
  current(fdi).forEach(f => { if (f.canal != null) rootHits[f.canal] = DXMAP[f.dxCode].name; });
  return `<div class="detail-card">
    <h3>Kanały korzeniowe<span class="fr">FR-063 · FR-065</span></h3>
    <div class="canal-row">
      <div class="stepper">
        <button type="button" data-canal-step="-1" ${t.canals <= 1 ? 'disabled' : ''} aria-label="Zmniejsz liczbę kanałów">−</button>
        <span class="val" aria-live="polite">${t.canals}</span>
        <button type="button" data-canal-step="1" ${t.canals >= 6 ? 'disabled' : ''} aria-label="Zwiększ liczbę kanałów">+</button>
      </div>
      <span class="canal-default ${t.canals !== t.canalsDefault ? 'changed' : ''}">
        ${t.canals === t.canalsDefault ? `domyślnie ${t.canalsDefault}` : `zmieniono z ${t.canalsDefault}`}
      </span>
    </div>
    <ul class="canal-list">${names.map((n, idx) => `
      <li><span class="cn">${idx + 1}</span>
        <button type="button" data-canal="${idx}" aria-pressed="${state.canal === idx}">${esc(n)}</button>
        ${rootHits[idx] ? `<span class="status-pill pill-done" title="${esc(rootHits[idx])}">wpis</span>` : ''}
      </li>`).join('')}</ul>
  </div>`;
}

function dxPicker(query) {
  const q = (query || '').trim().toLowerCase();
  const hits = DX.filter(d => !q || d.name.toLowerCase().includes(q) || (d.icd || '').toLowerCase().includes(q) || d.code.toLowerCase().includes(q));
  let html = '', lastCat = null;
  CAT.forEach(([key, label]) => {
    const inCat = hits.filter(d => d.cat === key);
    if (!inCat.length) return;
    html += `<li class="dx-group">${label}</li>`;
    inCat.forEach(d => {
      const scopeCls = { surface: 'scope-surface', tooth: 'scope-tooth', root: 'scope-root', perio: 'scope-perio', ask: 'scope-tooth' }[d.scope];
      const scopeTxt = { surface: 'powierzchnia', tooth: 'cały ząb', root: 'korzeń/kanał', perio: 'przyzębie', ask: 'wybierz zakres' }[d.scope];
      html += `<li><button type="button" class="dx-item" data-dx="${d.code}" aria-pressed="${state.dx === d.code}">
        <span class="layer-dot ${d.layer === 'diagnosis' ? 'layer-diag' : 'layer-rest'}"></span>
        <span class="dx-name">${esc(d.name)}</span>
        <span class="scope-tag ${scopeCls}">${scopeTxt}</span>
        <span class="dx-meta">${d.icd || '—'}</span></button></li>`;
    });
  });
  return html || `<li class="empty" style="padding:14px">Brak pozycji dla „${esc(query)}”. Użyj „Inne rozpoznanie”.</li>`;
}

function effScope() {
  if (!state.dx) return null;
  const d = DXMAP[state.dx];
  return d.scope === 'ask' ? state.scopeAsk : d.scope;
}
function validation() {
  if (!state.selection.size) return 'Zaznacz co najmniej jeden ząb.';
  if (!state.dx) return 'Wybierz pozycję ze słownika rozpoznań.';
  const d = DXMAP[state.dx];
  if (d.needsNote && !document.getElementById('noteField')?.value.trim())
    return 'Pozycja „inne rozpoznanie” wymaga opisu (FR-011a).';
  if (effScope() === 'surface' && !state.surfaces.size)
    return 'To rozpoznanie dotyczy powierzchni — wskaż co najmniej jedną (FR-022).';
  return null;
}

function findingRow(f) {
  const d = DXMAP[f.dxCode], m = meta(f.tooth);
  const cls = ['finding'];
  if (f.layer === 'existing') cls.push('rest');
  if (f.clinical === 'closed') cls.push('done');
  if (f.record === 'superseded') cls.push('stale');
  const loc = f.surfaces.length ? f.surfaces.map(s => s).join('') + ' · ' + f.surfaces.map(s => SURFACE_NAME(f.tooth, s)).join(', ')
    : f.canal != null ? 'kanał ' + (f.canal + 1)
    : d.scope === 'perio' ? 'przyzębie' : 'cały ząb';
  const pill = f.record === 'superseded' ? '<span class="status-pill pill-stale">nieaktualny</span>'
    : f.clinical === 'closed' ? '<span class="status-pill pill-done">zakończone</span>'
    : '<span class="status-pill pill-active">aktywne</span>';
  return `<li class="${cls.join(' ')}" data-finding="${f.id}">
    <div class="finding-top">
      <span class="finding-name">${esc(d.name)}</span>${pill}
      ${d.needsNote ? '<span class="status-pill pill-flag">do doprecyzowania</span>' : ''}
    </div>
    <div class="finding-loc">${esc(loc)}${f.severity ? ' · ' + esc(f.severity) : ''}</div>
    <div class="finding-meta">ząb ${f.tooth} · ${f.date} · ${esc(f.author)} (${f.role})${f.closedAt ? ' · zakończono ' + f.closedAt : ''}</div>
    ${f.note ? `<div class="finding-note">${esc(f.note)}</div>` : ''}
    ${f.record === 'current' && f.clinical === 'active' ? `<div class="finding-actions">
      <button type="button" class="link-btn" data-close="${f.id}">Zakończ (wyleczone)</button>
      <button type="button" class="link-btn" data-correct="${f.id}">Koryguj</button>
    </div>` : ''}

}

    ? `<div class="detail-card"><h3>Części zęba wspólne dla zaznaczenia<span class="fr">FR-004a</span></h3>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${['M', 'D', 'B', 'L', 'O', 'I'].map(s => `<button type="button" class="chip" data-surface-chip="${s}" aria-pressed="${state.surfaces.has(s)}">${s}</button>`).join('')}
        </div>
        <p class="hint" style="margin:8px 0 0">Powierzchnie nieistniejące dla danego zęba (np. żująca w siekaczu) zostaną pominięte i wymienione przed zapisem.</p></div>`
    : `<div class="detail-card"><h3>Powierzchnie<span class="fr">FR-024 · FR-026</span></h3>${surfaceMapSvg(fdi)}
        <p class="hint" style="margin-top:6px">${esc(m.surfaces.map(s => s + ' — ' + SURFACE_NAME(fdi, s)).join(' · '))}</p></div>`;

  const pool = multi ? sel.flatMap(x => state.teeth[x].findings) : state.teeth[fdi].findings;
  const findings = pool.filter(f => f.record === 'current' && f.clinical === 'active');
  const history = pool.filter(f => f.record === 'superseded' || f.clinical === 'closed');

  inspBody.innerHTML = `
    ${head}
    <div class="detail-grid">
      ${detail}
      ${multi ? '' : canalCard(fdi)}
    </div>

    <div class="field">
      <label for="dxSearch">Jednostka chorobowa / stan<span class="fr">FR-011 · FR-013</span></label>
      <input type="text" id="dxSearch" placeholder="Szukaj po nazwie lub kodzie ICD-10…" value="${esc(state.query || '')}" autocomplete="off">
      <ul class="dx-list" id="dxList">${dxPicker(state.query)}</ul>
    </div>

    ${dx && dx.scope === 'ask' ? `<div class="field"><label for="scopeSel">Zakres anatomiczny<span class="fr">FR-011a</span></label>
      <select id="scopeSel">
        <option value="surface" ${state.scopeAsk === 'surface' ? 'selected' : ''}>powierzchnia zęba</option>
        <option value="tooth" ${state.scopeAsk === 'tooth' ? 'selected' : ''}>cały ząb</option>
        <option value="root" ${state.scopeAsk === 'root' ? 'selected' : ''}>korzeń / kanał</option>
        <option value="perio" ${state.scopeAsk === 'perio' ? 'selected' : ''}>przyzębie</option>
      </select></div>` : ''}

    ${dx && dx.sev ? `<div class="field"><label for="sevSel">Nasilenie / stan<span class="fr">FR-018</span></label>
      <select id="sevSel">${dx.sev.map(s => `<option>${esc(s)}</option>`).join('')}</select></div>` : ''}

    <div class="field">
      <label for="noteField">Notatka${dx && dx.needsNote ? ' (wymagana)' : ' (opcjonalna)'}<span class="fr">FR-017</span></label>
      <textarea id="noteField" placeholder="Np. ubytek sięgający zębiny, bez objawów ze strony miazgi."></textarea>
    </div>

    <div class="field" style="max-width:180px">
      <label for="dateField">Data rozpoznania<span class="fr">FR-036</span></label>
      <input type="date" id="dateField" value="2026-08-30" max="2026-08-30">
    </div>

    ${problem ? `<p class="hint block">▲ ${esc(problem)}</p>` : `<p class="hint">Zapis utworzy ${sel.length === 1 ? 'jeden wpis' : sel.length + ' ' + plural(sel.length, 'odrębny wpis', 'odrębne wpisy', 'odrębnych wpisów')}; każdy z własną historią i możliwością korekty.</p>`}

    <div class="actions">
      <button type="button" class="btn btn-primary" id="saveBtn" ${problem ? 'disabled' : ''}>Zapisz ${sel.length > 1 ? plural(sel.length, 'wpis', 'wpisy', 'wpisy') : 'wpis'}</button>
      <button type="button" class="btn btn-ghost" id="resetBtn">Wyczyść formularz</button>
    </div>

    <div>
      <div class="eyebrow" style="margin-bottom:8px">Bieżące wpisy<span class="fr">FR-034</span></div>
      ${findings.length ? `<ul class="findings">${findings.map(findingRow).join('')}</ul>`
        : `<p class="empty" style="padding:12px">Brak odnotowanych zmian.</p>`}
    </div>

    ${history.length ? `<details><summary style="cursor:pointer;font-size:13px;color:var(--text-muted);font-weight:500">
        Historia zęba (${history.length})<span class="fr">FR-034</span></summary>
      <ul class="findings" style="margin-top:8px">${history.map(findingRow).join('')}</ul></details>` : ''}
  `;
}

/* ══ INTERAKCJE ═══════════════════════════════════════════════════════════ */
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg) {
  toastEl.innerHTML = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4200);
}

function refresh() { syncArchClasses(); renderInspector(); updateSelBar(); syncBackBtn(); renderOverview(); }
function updateSelBar() {
  const n = state.selection.size, c = document.getElementById('selCount');
  const parts = [];
  if (n) parts.push(`${n} ${plural(n, 'ząb', 'zęby', 'zębów')}`);
  const sn = state.surfaces.size;
  if (sn) parts.push(`${sn} ${plural(sn, 'powierzchnia', 'powierzchnie', 'powierzchni')}`);
  c.textContent = parts.length ? parts.join(' · ') : 'nic nie zaznaczono';
  c.classList.toggle('on', n > 0);
}

function selectTooth(fdi, additive) {
  if (additive) {
    state.selection.has(fdi) ? state.selection.delete(fdi) : state.selection.add(fdi);
  } else {
    const only = state.selection.size === 1 && state.selection.has(fdi);
    state.selection.clear();
    if (!only) state.selection.add(fdi);
    state.surfaces.clear();
    state.canal = null;
  }
  refresh();
}

let dragging = false, dragAdded = new Set();
archSvg.addEventListener('pointerdown', e => {
  const g = e.target.closest('.tooth');
  if (!g) return;
  const fdi = +g.dataset.fdi;
  dragging = true; dragAdded = new Set([fdi]);
  selectTooth(fdi, e.shiftKey || e.ctrlKey || e.metaKey);
  g.focus({ preventScroll: true });
});
archSvg.addEventListener('pointerover', e => {
  if (!dragging) return;
  const g = e.target.closest('.tooth');
  if (!g) return;
  const fdi = +g.dataset.fdi;
  if (dragAdded.has(fdi)) return;
  dragAdded.add(fdi);
  state.selection.add(fdi);
  refresh();
});
window.addEventListener('pointerup', () => { dragging = false; });

archSvg.addEventListener('keydown', e => {
  const g = e.target.closest('.tooth');
  if (!g) return;
  const list = [...archSvg.querySelectorAll('.tooth')];
  const i = list.indexOf(g);
  let next = null;
  const perRow = rows()[0].length;
  if (e.key === 'ArrowRight') next = list[Math.min(i + 1, list.length - 1)];
  else if (e.key === 'ArrowLeft') next = list[Math.max(i - 1, 0)];
  else if (e.key === 'ArrowDown') next = list[Math.min(i + perRow, list.length - 1)];
  else if (e.key === 'ArrowUp') next = list[Math.max(i - perRow, 0)];
  else if (e.key === 'Home') next = list[0];
  else if (e.key === 'End') next = list[list.length - 1];
  else if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    selectTooth(+g.dataset.fdi, e.shiftKey);
    return;
  } else return;
  e.preventDefault();
  if (next) next.focus({ preventScroll: true });
});

/* skróty zaznaczania (FR-004b) */
document.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
  const kind = b.dataset.pick, vis = visibleTeeth();
  const pick = vis.filter(fdi => {
    const m = meta(fdi);
    switch (kind) {
      case 'q1': return m.q === 1 || m.q === 5;
      case 'q2': return m.q === 2 || m.q === 6;
      case 'q3': return m.q === 3 || m.q === 7;
      case 'q4': return m.q === 4 || m.q === 8;
      case 'upper': return m.upper;
      case 'lower': return !m.upper;
      case 'anterior': return m.anterior;
      case 'posterior': return !m.anterior;
    }
  });
  pick.forEach(fdi => state.selection.add(fdi));
  refresh();
}));
document.getElementById('clearSel').addEventListener('click', () => {
  state.selection.clear(); state.surfaces.clear(); state.canal = null; refresh();
});

/* warstwy (FR-009) */
document.querySelectorAll('[data-layer]').forEach(b => b.addEventListener('click', () => {
  state.layer = b.dataset.layer;
  document.querySelectorAll('[data-layer]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  refresh();
}));

/* tryb uzębienia (FR-043 · FR-044) */
document.querySelectorAll('[data-dentition]').forEach(b => b.addEventListener('click', () => {
  state.dentition = b.dataset.dentition;
  document.querySelectorAll('[data-dentition]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  const vis = new Set(visibleTeeth());
  const hidden = [...state.selection].filter(t => !vis.has(t));
  const hiddenWithData = visibleHiddenWithFindings(vis);
  hidden.forEach(t => state.selection.delete(t));
  renderArch(); refresh();
  if (hiddenWithData.length) toast(`Ukryto ${hiddenWithData.length} ${plural(hiddenWithData.length, 'pozycję', 'pozycje', 'pozycji')} z wpisami (${hiddenWithData.join(', ')}) — nic nie zostało usunięte. <b>FR-047</b>`);
}));
function visibleHiddenWithFindings(vis) {
  return Object.keys(state.teeth).map(Number)
    .filter(t => !vis.has(t) && state.teeth[t].findings.length)
    .sort((a, b) => a - b);
}

/* inspektor — delegacja zdarzeń */
inspBody.addEventListener('click', e => {
  const surf = e.target.closest('[data-surface]');
  if (surf) { toggleSurface(surf.dataset.surface); return; }
  const chip = e.target.closest('[data-surface-chip]');
  if (chip) { toggleSurface(chip.dataset.surfaceChip); return; }
  const dxBtn = e.target.closest('[data-dx]');
  if (dxBtn) {
    state.dx = state.dx === dxBtn.dataset.dx ? null : dxBtn.dataset.dx;
    const d = state.dx && DXMAP[state.dx];
    if (d && d.scope !== 'surface' && d.scope !== 'ask') state.surfaces.clear();
    refresh(); return;
  }
  const step = e.target.closest('[data-canal-step]');
  if (step) { stepCanals(+step.dataset.canalStep); return; }
  const canal = e.target.closest('[data-canal]');
  if (canal) { state.canal = state.canal === +canal.dataset.canal ? null : +canal.dataset.canal; refresh(); return; }
  if (e.target.id === 'saveBtn') { save(); return; }
  if (e.target.id === 'resetBtn') { state.dx = null; state.surfaces.clear(); state.canal = null; state.query = ''; refresh(); return; }
  const close = e.target.closest('[data-close]');
  if (close) { closeFinding(close.dataset.close); return; }
  const corr = e.target.closest('[data-correct]');
  if (corr) { correctFinding(corr.dataset.correct); return; }
});
inspBody.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('[data-surface]')) {
    e.preventDefault(); toggleSurface(e.target.closest('[data-surface]').dataset.surface);
  }
});
inspBody.addEventListener('input', e => {
  if (e.target.id === 'dxSearch') {
    state.query = e.target.value;
    document.getElementById('dxList').innerHTML = dxPicker(state.query);
  }
});
inspBody.addEventListener('change', e => {
  if (e.target.id === 'scopeSel') { state.scopeAsk = e.target.value; refresh(); }
});

function toggleSurface(s) {
  state.surfaces.has(s) ? state.surfaces.delete(s) : state.surfaces.add(s);
  refresh();
}

function stepCanals(delta) {
  const fdi = [...state.selection][0];
  const t = state.teeth[fdi];
  const next = Math.min(6, Math.max(1, t.canals + delta));
  if (next === t.canals) return;
  if (next < t.canals) {
    const orphan = current(fdi).filter(f => f.canal != null && f.canal >= next);
    if (orphan.length && !confirm(
      `Zmniejszasz liczbę kanałów do ${next}. ${orphan.length} ${plural(orphan.length, 'wpis dotyczy', 'wpisy dotyczą', 'wpisów dotyczy')} kanału, `
      + 'który przestanie istnieć. Wpisy zostaną zachowane w historii zęba, oznaczone jako dotyczące kanału nieobecnego w modelu. Kontynuować?')) return;
  }
  t.canals = next;
  if (state.canal != null && state.canal >= next) state.canal = null;
  renderArch(); refresh();
  toast(next === t.canalsDefault
    ? `Ząb ${fdi}: przywrócono domyślną liczbę kanałów (${next}).`
    : `Ząb ${fdi}: liczba kanałów ${next} — inna niż domyślna (${t.canalsDefault}). <b>FR-065</b>`);
}

function save() {
  if (validation()) return;
  const d = DXMAP[state.dx], scope = effScope();
  const note = document.getElementById('noteField').value.trim();
  const date = document.getElementById('dateField').value;
  const sev = document.getElementById('sevSel')?.value || null;
  const made = [], skipped = [];
  [...state.selection].sort((a, b) => a - b).forEach(fdi => {
    const m = meta(fdi), t = state.teeth[fdi];
    const absent = t.presence === 'extracted' || t.presence === 'agenesis';
    if (absent && !d.absentOk) { skipped.push(`${fdi} — brak zęba (FR-040)`); return; }
    if (d.absentOnly && !absent) { skipped.push(`${fdi} — pozycja ma własny ząb`); return; }
    let surfaces = [];
    if (scope === 'surface') {
      surfaces = [...state.surfaces].filter(s => m.surfaces.includes(s));
      if (!surfaces.length) { skipped.push(`${fdi} — brak wskazanych powierzchni w tym zębie`); return; }
    }
    let canal = null;
    if (scope === 'root' && state.canal != null) {
      if (state.canal < t.canals) canal = state.canal;
      else { skipped.push(`${fdi} — ma tylko ${t.canals} ${plural(t.canals, 'kanał', 'kanały', 'kanałów')}`); return; }
    }
    addFinding(fdi, { dxCode: state.dx, surfaces, canal, severity: sev, note, date });
    made.push(fdi);
  });
  state.dx = null; state.surfaces.clear(); state.canal = null; state.query = '';
  renderArch(); refresh();
  let msg = made.length
    ? `Zapisano ${made.length} ${plural(made.length, 'wpis', 'wpisy', 'wpisów')} (${plural(made.length, 'ząb', 'zęby', 'zęby')} ${made.join(', ')}).`
    : 'Nie zapisano żadnego wpisu.';
  if (skipped.length) msg += `<br>Pominięto: ${skipped.join('; ')}.`;
  toast(msg);
}

function closeFinding(id) {
  const f = findById(id);
  f.clinical = 'closed';
  f.closedAt = '2026-08-30';
  const dxp = DXMAP[f.dxCode];
  if (dxp.presence === 'unerupted' && state.teeth[f.tooth].presence === 'unerupted') state.teeth[f.tooth].presence = 'present';
  renderArch(); refresh();
  toast(`Ząb ${f.tooth}: rozpoznanie „${DXMAP[f.dxCode].name}” oznaczone jako zakończone. Wpis pozostaje w historii zęba. <b>FR-032</b>`);
}
function correctFinding(id) {
  const f = findById(id);
  f.record = 'superseded';
  const dxp = DXMAP[f.dxCode];
  if (dxp.presence && state.teeth[f.tooth].presence === dxp.presence) state.teeth[f.tooth].presence = 'present';
  state.selection.clear(); state.selection.add(f.tooth);
  state.dx = f.dxCode;
  state.surfaces = new Set(f.surfaces);
  state.canal = f.canal;
  state.query = '';
  renderArch(); refresh();
  const nf = document.getElementById('noteField');
  if (nf) nf.value = f.note;
  toast('Poprzedni wpis oznaczony jako nieaktualny i przeniesiony do historii zęba. Popraw dane i zapisz — powstanie nowy wpis wskazujący poprzedni. Nic nie zostało nadpisane. <b>FR-033</b>');
}
function findById(id) {
  for (const k in state.teeth) { const f = state.teeth[k].findings.find(x => x.id === id); if (f) return f; }
}

/* przegląd uzębienia — wypełnia kolumnę treścią, nie ozdobą (US2) */
function renderOverview() {
  const vis = visibleTeeth();
  let diag = 0, rest = 0, absent = 0, canal = 0;
  const attention = [];
  vis.forEach(fdi => {
    const t = state.teeth[fdi], a = activeF(fdi);
    const d = a.filter(f => f.layer === 'diagnosis');
    if (d.length) { diag += d.length; attention.push({ fdi, kind: 'diag', txt: DXMAP[d[0].dxCode].name }); }
    rest += a.filter(f => f.layer === 'existing').length;
    if (t.presence === 'extracted' || t.presence === 'agenesis') { absent++; attention.push({ fdi, kind: 'absent', txt: 'brak zęba' }); }
    if (t.canals !== t.canalsDefault) canal++;
  });
  document.getElementById('overview').innerHTML = `
    <div class="ov-stats">
      <span class="ov-stat ov-diag"><b>${diag}</b><span>${plural(diag, 'aktywne rozpoznanie', 'aktywne rozpoznania', 'aktywnych rozpoznań')}</span></span>
      <span class="ov-stat ov-rest"><b>${rest}</b><span>${plural(rest, 'wpis stanu istniejącego', 'wpisy stanu istniejącego', 'wpisów stanu istniejącego')}</span></span>
      <span class="ov-stat ov-absent"><b>${absent}</b><span>${plural(absent, 'brak zębowy', 'braki zębowe', 'braków zębowych')}</span></span>
      <span class="ov-stat ov-canal"><b>${canal}</b><span>${plural(canal, 'ząb z nietypową liczbą kanałów', 'zęby z nietypową liczbą kanałów', 'zębów z nietypową liczbą kanałów')}</span></span>
    </div>
    ${attention.length ? `<div class="ov-list"><span class="eyebrow">Wymaga uwagi</span>
      ${attention.slice(0, 14).map(a => `<button type="button" class="ov-tooth" data-goto="${a.fdi}" title="${esc(a.txt)}">
        <span class="dotm ${a.kind === 'diag' ? 'layer-diag' : ''}" style="${a.kind === 'absent' ? 'background:var(--text-disabled)' : ''}"></span>
        <b>${a.fdi}</b> ${esc(a.txt.length > 22 ? a.txt.slice(0, 21) + '…' : a.txt)}</button>`).join('')}
      ${attention.length > 14 ? `<span class="eyebrow">+${attention.length - 14}</span>` : ''}</div>`
      : `<p class="hint">Brak odnotowanych zmian w widocznym uzębieniu.</p>`}`;
}
document.getElementById('overview').addEventListener('click', e => {
  const b = e.target.closest('[data-goto]');
  if (!b) return;
  selectTooth(+b.dataset.goto, false);
  document.querySelector(`.tooth[data-fdi="${b.dataset.goto}"]`)?.focus({ preventScroll: true });
});

/* legenda (FR-008) */
const LEGEND = [
  ['bez odnotowanych zmian', 'healthy'],
  ['aktywne rozpoznanie (kreskowanie ukośne)', 'diseased'],
  ['stan istniejący / uzupełnienie', 'restored'],
  ['rozpoznanie zakończone (sam obrys)', 'closed'],
  ['brak zęba — usunięty lub wrodzony', 'absent'],
  ['ząb niewyrznięty / zatrzymany', 'unerupted'],
  ['ząb zaznaczony', 'selected'],
  ['liczba kanałów inna niż domyślna', 'canal'],
];
function renderLegend() {
  document.getElementById('legendGrid').innerHTML = LEGEND.map(([label, kind]) => {
    let inner;
    if (kind === 'canal') inner = '<circle cx="14" cy="14" r="4.5" fill="var(--warning)"></circle>';
    else {
      const stroke = { healthy: 'var(--tooth-stroke)', diseased: 'var(--tooth-diseased-stroke)', restored: 'var(--tooth-restored-stroke)', closed: 'var(--tooth-closed-stroke)', absent: 'var(--tooth-absent)', unerupted: 'var(--tooth-stroke)', selected: 'var(--tooth-selected-stroke)' }[kind];
      const fill = { healthy: 'var(--tooth-fill)', diseased: 'url(#hatchDiag2)', restored: 'var(--tooth-restored-fill)', closed: 'var(--tooth-fill)', absent: 'none', unerupted: 'var(--tooth-fill)', selected: 'var(--tooth-fill)' }[kind];
      const dash = (kind === 'absent' || kind === 'unerupted') ? ' stroke-dasharray="3 3"' : '';
      const w = kind === 'selected' ? 2.6 : 1.4;
      inner = `<rect x="5" y="5" width="18" height="18" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="${w}"${dash}></rect>`
        + (kind === 'absent' ? '<path d="M7 7l14 14M21 7L7 21" stroke="var(--tooth-absent)" stroke-width="1.4"></path>' : '');
    }
    return `<span class="legend-item"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">${inner}</svg>${esc(label)}</span>`;
  }).join('');
}

/* motyw i odniesienia do wymagań */
const themeBtn = document.getElementById('themeToggle');
themeBtn.addEventListener('click', () => {
  const root = document.documentElement;
  const now = root.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = now === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  document.getElementById('themeIcon').textContent = next === 'dark' ? '◑' : '◐';
  document.getElementById('themeLabel').textContent = next === 'dark' ? 'Ciemny' : 'Jasny';
});
const frBtn = document.getElementById('frToggle');
frBtn.addEventListener('click', () => {
  const on = document.documentElement.classList.toggle('show-fr');
  frBtn.setAttribute('aria-pressed', String(on));
});

/* powrót do łuku i przewinięcie do inspektora na wąskich ekranach (FR-006) */
const backBtn = document.getElementById('backToArch');
backBtn.addEventListener('click', () => {
  document.querySelector('.arch-wrap').scrollIntoView({ behavior: prefersReduced() ? 'auto' : 'smooth', block: 'start' });
});
function prefersReduced() { return matchMedia('(prefers-reduced-motion: reduce)').matches; }
function narrow() { return window.innerWidth < 1260; }
function syncBackBtn() { backBtn.classList.toggle('on', narrow() && state.selection.size > 0); }

/* start */
document.documentElement.lang = 'pl';
renderArch(); renderLegend(); refresh();
state.selection.add(36);
refresh();
})();
