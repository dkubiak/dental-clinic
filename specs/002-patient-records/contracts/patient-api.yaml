openapi: 3.0.3
info:
  title: Dental Clinic - Patient Records API
  version: "0.1.0"
  description: >
    REST API served by the independent `patient-service` deployable (own Helm release, own
    Deployment — plan.md Risk Tier & Availability) for the patient-records (kartoteka) module:
    basic patient data, the read-only visit-history placeholder, the medical-history
    sub-resources (since feature 004) — allergies, medications, chronic conditions — and (since
    feature 005) the full clinical odontogram: positions, root canals, dentition mode, and
    append-only diagnosis findings, replacing feature 002's original binary tooth-chart
    (HEALTHY/SICK).
    Authorization is enforced server-side only (@PreAuthorize), same as auth-service's
    auth-api — the Angular frontend's route/UI guards are UX-only. patient-service validates
    the caller by reading the same session table auth-service writes (research.md #7) — no
    separate login endpoint exists here. See rbac-policy.md (updated by this feature) for the
    authoritative permission matrix; RECEPTION/DOCTOR/ADMINISTRATOR are defined in 001,
    ASSISTANT is introduced by this feature.
servers:
  - url: /
    description: >
      No /api prefix — matches the existing bare-path convention (/accounts, /audit-log) that
      nginx/proxy.conf.json already route to auth-service; this feature adds a sibling
      /patients route to patient-service the same way.

security:
  - sessionCookie: []

paths:
  /patients:
    get:
      summary: Search existing patient records (FR-012).
      description: >
        Available to RECEPTION, DOCTOR, ASSISTANT (basic-data read access). Matches by
        last name (case-insensitive, partial) or exact PESEL.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          description: Last-name fragment or exact PESEL.
      responses:
        "200":
          description: Matching patient records (basic data only).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PatientSummary" }
        "404":
          description: Caller's role has no read access to patient basic data (deny → 404, per 001's rbac-policy.md rule 2).
    post:
      summary: Create a new patient record (FR-001).
      description: Available to RECEPTION, DOCTOR only. Audit-logged as PATIENT_RECORD_CREATED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatientCreateRequest" }
      responses:
        "201":
          description: Record created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientDetail" }
        "400":
          description: Invalid PESEL format/checksum, or missing required basic-data field (US1 Acceptance Scenario 3).
        "409":
          description: PESEL already exists on another record (FR-003, US1 Acceptance Scenario 4).
        "404":
          description: Caller's role is not RECEPTION/DOCTOR (deny → 404).

  /patients/{patientId}:
    get:
      summary: Read a patient's basic data (FR-001, identification use).
      description: Available to RECEPTION, DOCTOR, ASSISTANT.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientDetail" }
        "404":
          description: Not found, or caller's role has no read access (both cases return 404, per 001's rbac-policy.md rule 2).
    patch:
      summary: Edit a patient's basic data (FR-011).
      description: Available to RECEPTION, DOCTOR only. Audit-logged as PATIENT_RECORD_UPDATED with before/after state.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatientUpdateRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientDetail" }
        "400":
          description: Invalid PESEL format/checksum.
        "409":
          description: PESEL already exists on another record.
        "404":
          description: Not found, or caller's role is not RECEPTION/DOCTOR.

  # --- Replaced by feature 005 (005-tooth-chart-diagnoses). The single binary /tooth-chart
  # GET+PATCH pair (32 teeth, HEALTHY/SICK) is replaced wholesale — no production data exists to
  # migrate (spec.md Assumptions, research.md D1) — by the richer surface below: 52 positions,
  # per-position presence/canals, and append-only diagnosis findings following the same
  # supersede-based correction pattern feature 004 established (research.md D3).
  /patients/{patientId}/tooth-chart:
    get:
      summary: Read a patient's full odontogram — 52 positions, canals, current findings (FR-005).
      description: >
        Available to DOCTOR, ASSISTANT only — RECEPTION has no access (FR-059). Audit-logged as
        TOOTH_CHART_VIEWED.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToothChart" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.

  /patients/{patientId}/tooth-chart/dentition-mode:
    patch:
      summary: Override the proposed dentition mode (FR-044, FR-045).
      description: >
        Available to DOCTOR, ASSISTANT only. Never deletes or hides existing findings (FR-047) —
        purely a view filter over the 52 positions that always exist. Audit-logged as
        DENTITION_MODE_CHANGED with before/after state.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dentitionMode]
              properties:
                dentitionMode: { type: string, enum: [PERMANENT, DECIDUOUS, MIXED] }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToothChart" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.

  /patients/{patientId}/tooth-chart/positions/{fdiNumber}/presence:
    patch:
      summary: Set a position's presence — obecny/usunięty/wrodzony brak/niewyrznięty (FR-038).
      description: >
        Available to DOCTOR, ASSISTANT only. Audit-logged as TOOTH_POSITION_PRESENCE_CHANGED with
        before/after state. Returns 409 if `expectedVersion` doesn't match the position's current
        version (optimistic concurrency, research.md D7, FR-070).
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - $ref: "#/components/parameters/FdiNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [presence, expectedVersion]
              properties:
                presence: { type: string, enum: [PRESENT, EXTRACTED, CONGENITALLY_MISSING, UNERUPTED] }
                presenceDate: { type: string, format: date, nullable: true }
                expectedVersion: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToothPosition" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.
        "409":
          description: >
            `expectedVersion` is stale (another user changed this position since it was read,
            FR-070/SC-010), or the position has findings that would become invalid (FR-040).

  /patients/{patientId}/tooth-chart/positions/{fdiNumber}/history:
    get:
      summary: Read a position's full finding history — current, resolved, and superseded (FR-034).
      description: >
        Available to DOCTOR, ASSISTANT only. Audit-logged as TOOTH_CHART_VIEWED
        (metadata.detail = "position-history").
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - $ref: "#/components/parameters/FdiNumber"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ToothFinding" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.

  /patients/{patientId}/tooth-chart/positions/{fdiNumber}/canals:
    post:
      summary: Add a root canal to a position (up to 6, FR-065).
      description: >
        Available to DOCTOR, ASSISTANT only. Requires `presence = PRESENT` on the position.
        Audit-logged as ROOT_CANAL_ADDED.
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - $ref: "#/components/parameters/FdiNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: "Anatomical name, e.g. \"policzkowy bliższy\", \"MB2\" (FR-065)." }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootCanal" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.
        "409":
          description: Position already has 6 non-removed canals, or is not PRESENT.

  /patients/{patientId}/tooth-chart/positions/{fdiNumber}/canals/{canalId}:
    patch:
      summary: Rename a canal or change its treatment state (FR-065, FR-066).
      description: >
        Available to DOCTOR, ASSISTANT only. Audit-logged as ROOT_CANAL_CHANGED with before/after
        state. Returns 409 if `expectedVersion` is stale (research.md D7).
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - $ref: "#/components/parameters/FdiNumber"
        - name: canalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                name: { type: string, nullable: true }
                state: { type: string, enum: [NEEDS_TREATMENT, TREATED, UNDERTREATED], nullable: true }
                expectedVersion: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootCanal" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.
        "409":
          description: "`expectedVersion` is stale."
    delete:
      summary: Remove a canal — soft delete only (FR-068).
      description: >
        Available to DOCTOR, ASSISTANT only. Findings that reference this canal are never removed
        or hidden; they keep referencing it and the frontend flags it as absent-from-model
        (FR-068). Audit-logged as ROOT_CANAL_REMOVED with before/after state.
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - $ref: "#/components/parameters/FdiNumber"
        - name: canalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Canal marked removed.
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.

  /patients/{patientId}/tooth-chart/findings:
    post:
      summary: Add a clinical finding to one position (FR-022, US1).
      description: >
        Available to DOCTOR, ASSISTANT only, identical scope for both (FR-057/FR-058) —
        `authorRole` records which role the caller acted in. `surfaces` is required iff the
        referenced catalog entry's `anatomicalScope = SURFACE` (FR-022/FR-023). Audit-logged as
        TOOTH_FINDING_ADDED.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToothFindingCreateRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToothFinding" }
        "400":
          description: >
            Missing required surfaces for a SURFACE-scope entry, surfaces supplied for a
            non-SURFACE-scope entry, missing free-text description for the "inne rozpoznanie"
            entry, or a diagnosis date in the future / before the patient's date of birth (FR-036).
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.
        "409":
          description: Position's `presence != PRESENT` and the entry isn't `allowedForMissingTooth` (FR-040).

  /patients/{patientId}/tooth-chart/findings/bulk:
    post:
      summary: Add the same finding to multiple positions/parts in one save (FR-004a-c, US6).
      description: >
        Available to DOCTOR, ASSISTANT only. Creates one independent `ToothFinding` per applicable
        position inside a single transaction — never a shared "batch" entity (research.md D6).
        Positions where the entry doesn't apply (missing tooth, surface doesn't exist for that
        tooth type, canal doesn't exist) are skipped and reported, never silently dropped and
        never failing the whole call (FR-004a, US6 scenario 3/4). Each created finding gets its
        own TOOTH_FINDING_ADDED audit entry.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToothFindingBulkCreateRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToothFindingBulkResult" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.

  /patients/{patientId}/tooth-chart/findings/{findingId}/close:
    post:
      summary: Close/resolve a finding — e.g. after treatment (FR-032).
      description: >
        Available to DOCTOR, ASSISTANT only. Implemented as a correction (research.md D3): inserts
        a new `CURRENT` finding with `clinicalStatus = RESOLVED` and `supersedesFindingId` pointing
        at this one; the original flips to `SUPERSEDED`. Audit-logged as TOOTH_FINDING_ADDED with
        the superseded finding as `before_state`.
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - name: findingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolvedDate]
              properties:
                resolvedDate: { type: string, format: date }
                note: { type: string, nullable: true }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToothFinding" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.
        "409":
          description: >
            The finding is already SUPERSEDED (someone else corrected/closed it first —
            FR-070/SC-010; the partial unique index on `supersedesFindingId` makes this atomic).

  /patients/{patientId}/tooth-chart/findings/{findingId}/correct:
    post:
      summary: Correct a previously-saved finding, e.g. a wrong surface (FR-033, US3).
      description: >
        Available to DOCTOR, ASSISTANT only. Same supersede mechanism as `/close` (research.md
        D3), but with corrected field values instead of just a status flip. Never overwrites or
        deletes the original (FR-030). Audit-logged as TOOTH_FINDING_ADDED with the superseded
        finding as `before_state`.
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - name: findingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToothFindingCreateRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToothFinding" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.
        "409":
          description: The finding is already SUPERSEDED.

  /diagnosis-catalog:
    get:
      summary: Search the versioned, read-only diagnosis catalog (FR-013, FR-020).
      description: >
        Available to DOCTOR, ASSISTANT only. Not editable through any endpoint — it ships as
        Flyway-seeded reference data (research.md D5); there is no POST/PATCH/DELETE here.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Fragment of `nameNamePl` or `code` (FR-013).
        - name: quickAccessOnly
          in: query
          required: false
          schema: { type: boolean }
          description: When true, returns only entries flagged `quickAccess` (FR-020).
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiagnosisCatalogEntry" }
        "404":
          description: Caller's role is not DOCTOR/ASSISTANT.

  /patients/{patientId}/visit-history:
    get:
      summary: Read the (placeholder) visit-history section (FR-004).
      description: >
        Available to RECEPTION, DOCTOR. Always returns an empty list in this version —
        no write endpoint exists yet; this section is superseded by the future, separately
        specified visits module.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          description: Always an empty array in this version (US3 Acceptance Scenario 1/2).
          content:
            application/json:
              schema:
                type: array
                items: {}
                maxItems: 0
        "404":
          description: Not found, or caller's role is not RECEPTION/DOCTOR.

  # --- Added by feature 004 (004-patient-medical-history). Same shape repeated three times
  # (allergies / medications / chronic-conditions) — see rbac-policy.md rule 7,
  # 004/research.md #4 for why GET current vs. GET .../history are two endpoints rather than one
  # with a query flag, and 004/data-model.md for the record_status/supersedes_entry_id model
  # POST implements (there is no PATCH/DELETE — corrections are always a new POST, FR-010).
  /patients/{patientId}/allergies:
    get:
      summary: Read current (non-superseded) allergy entries (FR-001).
      description: Available to DOCTOR, ASSISTANT only.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AllergyEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.
    post:
      summary: Add an allergy entry, optionally correcting a prior one (FR-001, FR-010).
      description: >
        Available to DOCTOR only. If `supersedesEntryId` is set, that entry's `recordStatus`
        flips to SUPERSEDED in the same transaction. Audit-logged as MEDICAL_HISTORY_ENTRY_ADDED
        (metadata.entryType = ALLERGY).
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllergyCreateRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllergyEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR.

  /patients/{patientId}/allergies/history:
    get:
      summary: Read all allergy entries, current and superseded ("historia zmian") (FR-010).
      description: >
        Available to DOCTOR, ASSISTANT only — same scope as the current-only endpoint
        (rbac-policy.md rule 7). Audit-logged separately as MEDICAL_HISTORY_HISTORY_VIEWED.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AllergyEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.

  /patients/{patientId}/medications:
    get:
      summary: Read current (non-superseded) medication entries (FR-002).
      description: Available to DOCTOR, ASSISTANT only.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MedicationEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.
    post:
      summary: Add a medication entry, optionally correcting a prior one (FR-002, FR-010).
      description: >
        Available to DOCTOR only. Same correction semantics as /allergies. Audit-logged as
        MEDICAL_HISTORY_ENTRY_ADDED (metadata.entryType = MEDICATION).
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MedicationCreateRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicationEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR.

  /patients/{patientId}/medications/history:
    get:
      summary: Read all medication entries, current and superseded ("historia zmian") (FR-010).
      description: Available to DOCTOR, ASSISTANT only. Audit-logged as MEDICAL_HISTORY_HISTORY_VIEWED.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MedicationEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.

  /patients/{patientId}/chronic-conditions:
    get:
      summary: Read current (non-superseded) chronic-condition entries (FR-003).
      description: Available to DOCTOR, ASSISTANT only.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChronicConditionEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.
    post:
      summary: Add a chronic-condition entry, optionally correcting a prior one (FR-003, FR-010).
      description: >
        Available to DOCTOR only. Same correction semantics as /allergies — including flipping
        `clinicalStatus` (ACTIVE/PAST), which is independent of the correction's `recordStatus`
        (data-model.md). Audit-logged as MEDICAL_HISTORY_ENTRY_ADDED (metadata.entryType =
        CHRONIC_CONDITION).
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChronicConditionCreateRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChronicConditionEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR.

  /patients/{patientId}/chronic-conditions/history:
    get:
      summary: Read all chronic-condition entries, current and superseded ("historia zmian") (FR-010).
      description: Available to DOCTOR, ASSISTANT only. Audit-logged as MEDICAL_HISTORY_HISTORY_VIEWED.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChronicConditionEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.

  /patients/{patientId}/export:
    post:
      summary: Export a patient's full data (RODO subject-access request, FR-009).
      description: >
        Available to DOCTOR only (research.md #6 — deliberately not ADMINISTRATOR, to avoid
        silently granting clinical-data access to a role rbac-policy.md excludes from it).
        Audit-logged as PATIENT_DATA_EXPORTED.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          description: >
            Full patient data export (basic data + tooth chart; visit-history is empty in this
            version). Since feature 004, also includes the full allergy/medication/chronic-
            condition history — current and superseded entries alike (004/research.md #6, a
            subject-access request covers everything held, not just the current view).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientFullExport" }
        "404":
          description: Not found, or caller's role is not DOCTOR.

  /patients/{patientId}/erasure-request:
    post:
      summary: Request erasure/anonymization of a patient's data (RODO, FR-010).
      description: >
        Available to DOCTOR only (same rationale as /export). Subject to legal medical-record
        retention requirements (spec.md Assumptions) — does not guarantee immediate deletion.
        Audit-logged as PATIENT_DATA_ERASURE_REQUESTED, then PATIENT_DATA_ERASURE_COMPLETED
        once actually applied.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "202":
          description: Erasure request accepted for processing.
        "404":
          description: Not found, or caller's role is not DOCTOR.

components:
  parameters:
    PatientId:
      name: patientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FdiNumber:
      name: fdiNumber
      in: path
      required: true
      description: Added by feature 005. FDI/ISO 3950 position number — 32 permanent + 20 deciduous (FR-003).
      schema:
        type: integer
        enum: [11,12,13,14,15,16,17,18,21,22,23,24,25,26,27,28,31,32,33,34,35,36,37,38,41,42,43,44,45,46,47,48,
               51,52,53,54,55,61,62,63,64,65,71,72,73,74,75,81,82,83,84,85]

  schemas:
    PatientSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string, format: date }
        pesel: { type: string, nullable: true }

    PatientDetail:
      allOf:
        - $ref: "#/components/schemas/PatientSummary"
        - type: object
          properties:
            addressStreet: { type: string }
            addressBuildingNo: { type: string }
            addressPostalCode: { type: string }
            addressCity: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            hasCriticalAllergyAlert:
              type: boolean
              description: >
                Added by feature 004 (004-patient-medical-history). True if the patient has at
                least one CURRENT allergy entry with severity CRITICAL. Carries no clinical
                detail (no substance/reaction) by design, so it's visible to every role that can
                read basic data, including RECEPTION, which has no access to
                /allergies|/medications|/chronic-conditions themselves (rbac-policy.md rule 7).

    PatientCreateRequest:
      type: object
      required: [firstName, lastName, dateOfBirth, addressStreet, addressBuildingNo, addressPostalCode, addressCity]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string, format: date }
        pesel: { type: string, nullable: true, minLength: 11, maxLength: 11 }
        addressStreet: { type: string }
        addressBuildingNo: { type: string }
        addressPostalCode: { type: string }
        addressCity: { type: string }

    PatientUpdateRequest:
      $ref: "#/components/schemas/PatientCreateRequest"

    # --- Replaced by feature 005 (005-tooth-chart-diagnoses); ToothState/HEALTHY|SICK is gone,
    # see the schemas under "Added by feature 005" below.

    PatientFullExport:
      type: object
      properties:
        patient: { $ref: "#/components/schemas/PatientDetail" }
        # Added by feature 005. Full odontogram export: chart + all 52 positions + canals +
        # complete finding history (current, resolved, and superseded alike — a subject-access
        # request covers everything held, not just the current view, same posture 004's own
        # export extension took).
        toothChart: { $ref: "#/components/schemas/ToothChart" }
        visitHistory:
          type: array
          items: {}
          maxItems: 0
        allergies:
          type: array
          description: Added by feature 004. Full history — current and superseded.
          items: { $ref: "#/components/schemas/AllergyEntry" }
        medications:
          type: array
          description: Added by feature 004. Full history — current and superseded.
          items: { $ref: "#/components/schemas/MedicationEntry" }
        chronicConditions:
          type: array
          description: Added by feature 004. Full history — current and superseded.
          items: { $ref: "#/components/schemas/ChronicConditionEntry" }

    # --- Added by feature 004 (004-patient-medical-history) ---

    RecordStatus:
      type: string
      enum: [CURRENT, SUPERSEDED]
      description: >
        Technical correction-lifecycle flag (data-model.md), independent of any clinical-status
        field an entity may also carry.

    AllergyEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        substance: { type: string }
        reactionType: { type: string }
        severity: { type: string, enum: [CRITICAL, MODERATE] }
        recordStatus: { $ref: "#/components/schemas/RecordStatus" }
        supersedesEntryId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    AllergyCreateRequest:
      type: object
      required: [substance, reactionType, severity]
      properties:
        substance: { type: string }
        reactionType: { type: string }
        severity: { type: string, enum: [CRITICAL, MODERATE] }
        supersedesEntryId:
          type: string
          format: uuid
          nullable: true
          description: Set only when this entry corrects a prior one (FR-010).

    MedicationEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        dosage: { type: string }
        startDate: { type: string, format: date }
        recordStatus: { $ref: "#/components/schemas/RecordStatus" }
        supersedesEntryId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    MedicationCreateRequest:
      type: object
      required: [name, dosage, startDate]
      properties:
        name: { type: string }
        dosage: { type: string }
        startDate: { type: string, format: date }
        supersedesEntryId: { type: string, format: uuid, nullable: true }

    ChronicConditionEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        clinicalStatus:
          type: string
          enum: [ACTIVE, PAST]
          description: The patient's actual health state — independent of recordStatus.
        diagnosisDate: { type: string, format: date }
        recordStatus: { $ref: "#/components/schemas/RecordStatus" }
        supersedesEntryId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    ChronicConditionCreateRequest:
      type: object
      required: [name, clinicalStatus, diagnosisDate]
      properties:
        name: { type: string }
        clinicalStatus: { type: string, enum: [ACTIVE, PAST] }
        diagnosisDate: { type: string, format: date }
        supersedesEntryId: { type: string, format: uuid, nullable: true }

    # --- Added by feature 005 (005-tooth-chart-diagnoses) ---

    ToothChart:
      type: object
      properties:
        patientId: { type: string, format: uuid }
        dentitionMode: { type: string, enum: [PERMANENT, DECIDUOUS, MIXED] }
        positions:
          type: array
          items: { $ref: "#/components/schemas/ToothPosition" }

    ToothPosition:
      type: object
      properties:
        fdiNumber: { type: integer }
        dentitionType: { type: string, enum: [PERMANENT, DECIDUOUS] }
        toothType: { type: string, enum: [INCISOR, CANINE, PREMOLAR, MOLAR] }
        presence: { type: string, enum: [PRESENT, EXTRACTED, CONGENITALLY_MISSING, UNERUPTED] }
        presenceDate: { type: string, format: date, nullable: true }
        version:
          type: integer
          description: Optimistic-concurrency token — echo back as `expectedVersion` on the next write (research.md D7).
        canals:
          type: array
          items: { $ref: "#/components/schemas/RootCanal" }
        currentFindings:
          type: array
          description: Only `recordStatus = CURRENT` findings (FR-034); full history is `.../history`.
          items: { $ref: "#/components/schemas/ToothFinding" }

    RootCanal:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        state: { type: string, enum: [NEEDS_TREATMENT, TREATED, UNDERTREATED] }
        removed: { type: boolean }
        version: { type: integer }

    DiagnosisCatalogEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        namePl: { type: string }
        category:
          type: string
          enum: [HARD_TISSUE, PULP_PERIAPICAL, TRAUMA, NON_CARIOUS_LESION, PERIODONTAL_SOFT_TISSUE, ERUPTION_MISSING, POST_TREATMENT_RESTORATION]
        anatomicalScope: { type: string, enum: [SURFACE, WHOLE_TOOTH, ROOT_PERIAPICAL, PERIODONTIUM] }
        layer: { type: string, enum: [DIAGNOSIS, EXISTING_STATE] }
        icd10Code: { type: string, nullable: true }
        severityOptions: { type: array, items: { type: string }, nullable: true }
        allowedForMissingTooth: { type: boolean }
        deciduousAllowed: { type: boolean }
        quickAccess: { type: boolean }
        requiresFreeText: { type: boolean }

    ToothFinding:
      type: object
      properties:
        id: { type: string, format: uuid }
        fdiNumber: { type: integer }
        diagnosisCatalogEntry: { $ref: "#/components/schemas/DiagnosisCatalogEntry" }
        surfaces:
          type: array
          nullable: true
          items: { type: string, enum: [MESIAL, DISTAL, VESTIBULAR, LINGUAL_PALATAL, OCCLUSAL_INCISAL] }
        rootCanalId: { type: string, format: uuid, nullable: true }
        severity: { type: string, nullable: true }
        freeTextDescription: { type: string, nullable: true }
        note: { type: string, nullable: true }
        diagnosisDate: { type: string, format: date }
        resolvedDate: { type: string, format: date, nullable: true }
        clinicalStatus: { type: string, enum: [ACTIVE, RESOLVED] }
        recordStatus: { type: string, enum: [CURRENT, SUPERSEDED] }
        supersedesFindingId: { type: string, format: uuid, nullable: true }
        authorAccountId: { type: string, format: uuid }
        authorRole: { type: string, enum: [DOCTOR, ASSISTANT], description: "Role the author acted in at write time (FR-058)." }
        createdAt: { type: string, format: date-time }

    ToothFindingCreateRequest:
      type: object
      required: [fdiNumber, diagnosisCatalogEntryId, diagnosisDate]
      properties:
        fdiNumber:
          type: integer
          description: >
            The target position (contract gap found during /speckit-implement: the endpoint path
            carries no {fdiNumber} segment, so the body must — matches ToothFindingBulkCreateRequest's
            existing fdiNumbers array). Ignored on `.../correct`, where the target position is fixed
            to the finding being corrected.
        diagnosisCatalogEntryId: { type: string, format: uuid }
        surfaces:
          type: array
          nullable: true
          items: { type: string, enum: [MESIAL, DISTAL, VESTIBULAR, LINGUAL_PALATAL, OCCLUSAL_INCISAL] }
          description: Required iff the catalog entry's `anatomicalScope = SURFACE` (FR-022/FR-023).
        rootCanalId: { type: string, format: uuid, nullable: true }
        severity: { type: string, nullable: true }
        freeTextDescription:
          type: string
          nullable: true
          description: Required iff the catalog entry `requiresFreeText` ("inne rozpoznanie", FR-011a).
        note: { type: string, nullable: true, maxLength: 1000 }
        diagnosisDate: { type: string, format: date }

    ToothFindingBulkCreateRequest:
      type: object
      required: [fdiNumbers, diagnosisCatalogEntryId, diagnosisDate]
      properties:
        fdiNumbers:
          type: array
          items: { type: integer }
          minItems: 1
          description: Target positions from a multi-select gesture — quadrant/arch/segment shortcuts or drag-select all resolve to this list client-side (FR-004b) before the call is made.
        diagnosisCatalogEntryId: { type: string, format: uuid }
        surfaces:
          type: array
          nullable: true
          items: { type: string, enum: [MESIAL, DISTAL, VESTIBULAR, LINGUAL_PALATAL, OCCLUSAL_INCISAL] }
          description: Applied to every applicable position, skipping surfaces that don't exist for a given tooth type (FR-004a).
        severity: { type: string, nullable: true }
        freeTextDescription: { type: string, nullable: true }
        note: { type: string, nullable: true, maxLength: 1000 }
        diagnosisDate: { type: string, format: date }

    ToothFindingBulkResult:
      type: object
      properties:
        created:
          type: array
          items: { $ref: "#/components/schemas/ToothFinding" }
        skipped:
          type: array
          items:
            type: object
            properties:
              fdiNumber: { type: integer }
              reason:
                type: string
                description: Human-readable, Polish (e.g. missing tooth, surface doesn't exist for this tooth type, canal not present) — FR-004a, US6 scenario 3/4.

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
