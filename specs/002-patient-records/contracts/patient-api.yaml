openapi: 3.0.3
info:
  title: Dental Clinic - Patient Records API
  version: "0.1.0"
  description: >
    REST API served by the independent `patient-service` deployable (own Helm release, own
    Deployment — plan.md Risk Tier & Availability) for the patient-records (kartoteka) module:
    basic patient data, tooth-chart view/edit, the read-only visit-history placeholder, and
    (since feature 004) the medical-history sub-resources — allergies, medications, chronic
    conditions.
    Authorization is enforced server-side only (@PreAuthorize), same as auth-service's
    auth-api — the Angular frontend's route/UI guards are UX-only. patient-service validates
    the caller by reading the same session table auth-service writes (research.md #7) — no
    separate login endpoint exists here. See rbac-policy.md (updated by this feature) for the
    authoritative permission matrix; RECEPTION/DOCTOR/ADMINISTRATOR are defined in 001,
    ASSISTANT is introduced by this feature.
servers:
  - url: /
    description: >
      No /api prefix — matches the existing bare-path convention (/accounts, /audit-log) that
      nginx/proxy.conf.json already route to auth-service; this feature adds a sibling
      /patients route to patient-service the same way.

security:
  - sessionCookie: []

paths:
  /patients:
    get:
      summary: Search existing patient records (FR-012).
      description: >
        Available to RECEPTION, DOCTOR, ASSISTANT (basic-data read access). Matches by
        last name (case-insensitive, partial) or exact PESEL.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          description: Last-name fragment or exact PESEL.
      responses:
        "200":
          description: Matching patient records (basic data only).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PatientSummary" }
        "404":
          description: Caller's role has no read access to patient basic data (deny → 404, per 001's rbac-policy.md rule 2).
    post:
      summary: Create a new patient record (FR-001).
      description: Available to RECEPTION, DOCTOR only. Audit-logged as PATIENT_RECORD_CREATED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatientCreateRequest" }
      responses:
        "201":
          description: Record created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientDetail" }
        "400":
          description: Invalid PESEL format/checksum, or missing required basic-data field (US1 Acceptance Scenario 3).
        "409":
          description: PESEL already exists on another record (FR-003, US1 Acceptance Scenario 4).
        "404":
          description: Caller's role is not RECEPTION/DOCTOR (deny → 404).

  /patients/{patientId}:
    get:
      summary: Read a patient's basic data (FR-001, identification use).
      description: Available to RECEPTION, DOCTOR, ASSISTANT.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientDetail" }
        "404":
          description: Not found, or caller's role has no read access (both cases return 404, per 001's rbac-policy.md rule 2).
    patch:
      summary: Edit a patient's basic data (FR-011).
      description: Available to RECEPTION, DOCTOR only. Audit-logged as PATIENT_RECORD_UPDATED with before/after state.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatientUpdateRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientDetail" }
        "400":
          description: Invalid PESEL format/checksum.
        "409":
          description: PESEL already exists on another record.
        "404":
          description: Not found, or caller's role is not RECEPTION/DOCTOR.

  /patients/{patientId}/tooth-chart:
    get:
      summary: Read a patient's full tooth chart (32 teeth) (FR-005).
      description: Available to DOCTOR, ASSISTANT only — RECEPTION has no access, per FR-006.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ToothState" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.

  /patients/{patientId}/tooth-chart/{toothNumber}:
    patch:
      summary: Set a single tooth's state to HEALTHY or SICK (FR-006).
      description: >
        Available to DOCTOR, ASSISTANT only. Audit-logged as TOOTH_STATE_CHANGED with
        before/after state.
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - name: toothNumber
          in: path
          required: true
          schema: { type: integer, enum: [11,12,13,14,15,16,17,18,21,22,23,24,25,26,27,28,31,32,33,34,35,36,37,38,41,42,43,44,45,46,47,48] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [HEALTHY, SICK] }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToothState" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.

  /patients/{patientId}/visit-history:
    get:
      summary: Read the (placeholder) visit-history section (FR-004).
      description: >
        Available to RECEPTION, DOCTOR. Always returns an empty list in this version —
        no write endpoint exists yet; this section is superseded by the future, separately
        specified visits module.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          description: Always an empty array in this version (US3 Acceptance Scenario 1/2).
          content:
            application/json:
              schema:
                type: array
                items: {}
                maxItems: 0
        "404":
          description: Not found, or caller's role is not RECEPTION/DOCTOR.

  # --- Added by feature 004 (004-patient-medical-history). Same shape repeated three times
  # (allergies / medications / chronic-conditions) — see rbac-policy.md rule 7,
  # 004/research.md #4 for why GET current vs. GET .../history are two endpoints rather than one
  # with a query flag, and 004/data-model.md for the record_status/supersedes_entry_id model
  # POST implements (there is no PATCH/DELETE — corrections are always a new POST, FR-010).
  /patients/{patientId}/allergies:
    get:
      summary: Read current (non-superseded) allergy entries (FR-001).
      description: Available to DOCTOR, ASSISTANT only.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AllergyEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.
    post:
      summary: Add an allergy entry, optionally correcting a prior one (FR-001, FR-010).
      description: >
        Available to DOCTOR only. If `supersedesEntryId` is set, that entry's `recordStatus`
        flips to SUPERSEDED in the same transaction. Audit-logged as MEDICAL_HISTORY_ENTRY_ADDED
        (metadata.entryType = ALLERGY).
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllergyCreateRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllergyEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR.

  /patients/{patientId}/allergies/history:
    get:
      summary: Read all allergy entries, current and superseded ("historia zmian") (FR-010).
      description: >
        Available to DOCTOR, ASSISTANT only — same scope as the current-only endpoint
        (rbac-policy.md rule 7). Audit-logged separately as MEDICAL_HISTORY_HISTORY_VIEWED.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AllergyEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.

  /patients/{patientId}/medications:
    get:
      summary: Read current (non-superseded) medication entries (FR-002).
      description: Available to DOCTOR, ASSISTANT only.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MedicationEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.
    post:
      summary: Add a medication entry, optionally correcting a prior one (FR-002, FR-010).
      description: >
        Available to DOCTOR only. Same correction semantics as /allergies. Audit-logged as
        MEDICAL_HISTORY_ENTRY_ADDED (metadata.entryType = MEDICATION).
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MedicationCreateRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicationEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR.

  /patients/{patientId}/medications/history:
    get:
      summary: Read all medication entries, current and superseded ("historia zmian") (FR-010).
      description: Available to DOCTOR, ASSISTANT only. Audit-logged as MEDICAL_HISTORY_HISTORY_VIEWED.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MedicationEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.

  /patients/{patientId}/chronic-conditions:
    get:
      summary: Read current (non-superseded) chronic-condition entries (FR-003).
      description: Available to DOCTOR, ASSISTANT only.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChronicConditionEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.
    post:
      summary: Add a chronic-condition entry, optionally correcting a prior one (FR-003, FR-010).
      description: >
        Available to DOCTOR only. Same correction semantics as /allergies — including flipping
        `clinicalStatus` (ACTIVE/PAST), which is independent of the correction's `recordStatus`
        (data-model.md). Audit-logged as MEDICAL_HISTORY_ENTRY_ADDED (metadata.entryType =
        CHRONIC_CONDITION).
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChronicConditionCreateRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChronicConditionEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR.

  /patients/{patientId}/chronic-conditions/history:
    get:
      summary: Read all chronic-condition entries, current and superseded ("historia zmian") (FR-010).
      description: Available to DOCTOR, ASSISTANT only. Audit-logged as MEDICAL_HISTORY_HISTORY_VIEWED.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChronicConditionEntry" }
        "404":
          description: Not found, or caller's role is not DOCTOR/ASSISTANT.

  /patients/{patientId}/export:
    post:
      summary: Export a patient's full data (RODO subject-access request, FR-009).
      description: >
        Available to DOCTOR only (research.md #6 — deliberately not ADMINISTRATOR, to avoid
        silently granting clinical-data access to a role rbac-policy.md excludes from it).
        Audit-logged as PATIENT_DATA_EXPORTED.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          description: >
            Full patient data export (basic data + tooth chart; visit-history is empty in this
            version). Since feature 004, also includes the full allergy/medication/chronic-
            condition history — current and superseded entries alike (004/research.md #6, a
            subject-access request covers everything held, not just the current view).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientFullExport" }
        "404":
          description: Not found, or caller's role is not DOCTOR.

  /patients/{patientId}/erasure-request:
    post:
      summary: Request erasure/anonymization of a patient's data (RODO, FR-010).
      description: >
        Available to DOCTOR only (same rationale as /export). Subject to legal medical-record
        retention requirements (spec.md Assumptions) — does not guarantee immediate deletion.
        Audit-logged as PATIENT_DATA_ERASURE_REQUESTED, then PATIENT_DATA_ERASURE_COMPLETED
        once actually applied.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "202":
          description: Erasure request accepted for processing.
        "404":
          description: Not found, or caller's role is not DOCTOR.

components:
  parameters:
    PatientId:
      name: patientId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    PatientSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string, format: date }
        pesel: { type: string, nullable: true }

    PatientDetail:
      allOf:
        - $ref: "#/components/schemas/PatientSummary"
        - type: object
          properties:
            addressStreet: { type: string }
            addressBuildingNo: { type: string }
            addressPostalCode: { type: string }
            addressCity: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            hasCriticalAllergyAlert:
              type: boolean
              description: >
                Added by feature 004 (004-patient-medical-history). True if the patient has at
                least one CURRENT allergy entry with severity CRITICAL. Carries no clinical
                detail (no substance/reaction) by design, so it's visible to every role that can
                read basic data, including RECEPTION, which has no access to
                /allergies|/medications|/chronic-conditions themselves (rbac-policy.md rule 7).

    PatientCreateRequest:
      type: object
      required: [firstName, lastName, dateOfBirth, addressStreet, addressBuildingNo, addressPostalCode, addressCity]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string, format: date }
        pesel: { type: string, nullable: true, minLength: 11, maxLength: 11 }
        addressStreet: { type: string }
        addressBuildingNo: { type: string }
        addressPostalCode: { type: string }
        addressCity: { type: string }

    PatientUpdateRequest:
      $ref: "#/components/schemas/PatientCreateRequest"

    ToothState:
      type: object
      properties:
        toothNumber: { type: integer }
        status: { type: string, enum: [HEALTHY, SICK] }
        updatedAt: { type: string, format: date-time, nullable: true }

    PatientFullExport:
      type: object
      properties:
        patient: { $ref: "#/components/schemas/PatientDetail" }
        toothChart:
          type: array
          items: { $ref: "#/components/schemas/ToothState" }
        visitHistory:
          type: array
          items: {}
          maxItems: 0
        allergies:
          type: array
          description: Added by feature 004. Full history — current and superseded.
          items: { $ref: "#/components/schemas/AllergyEntry" }
        medications:
          type: array
          description: Added by feature 004. Full history — current and superseded.
          items: { $ref: "#/components/schemas/MedicationEntry" }
        chronicConditions:
          type: array
          description: Added by feature 004. Full history — current and superseded.
          items: { $ref: "#/components/schemas/ChronicConditionEntry" }

    # --- Added by feature 004 (004-patient-medical-history) ---

    RecordStatus:
      type: string
      enum: [CURRENT, SUPERSEDED]
      description: >
        Technical correction-lifecycle flag (data-model.md), independent of any clinical-status
        field an entity may also carry.

    AllergyEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        substance: { type: string }
        reactionType: { type: string }
        severity: { type: string, enum: [CRITICAL, MODERATE] }
        recordStatus: { $ref: "#/components/schemas/RecordStatus" }
        supersedesEntryId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    AllergyCreateRequest:
      type: object
      required: [substance, reactionType, severity]
      properties:
        substance: { type: string }
        reactionType: { type: string }
        severity: { type: string, enum: [CRITICAL, MODERATE] }
        supersedesEntryId:
          type: string
          format: uuid
          nullable: true
          description: Set only when this entry corrects a prior one (FR-010).

    MedicationEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        dosage: { type: string }
        startDate: { type: string, format: date }
        recordStatus: { $ref: "#/components/schemas/RecordStatus" }
        supersedesEntryId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    MedicationCreateRequest:
      type: object
      required: [name, dosage, startDate]
      properties:
        name: { type: string }
        dosage: { type: string }
        startDate: { type: string, format: date }
        supersedesEntryId: { type: string, format: uuid, nullable: true }

    ChronicConditionEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        clinicalStatus:
          type: string
          enum: [ACTIVE, PAST]
          description: The patient's actual health state — independent of recordStatus.
        diagnosisDate: { type: string, format: date }
        recordStatus: { $ref: "#/components/schemas/RecordStatus" }
        supersedesEntryId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    ChronicConditionCreateRequest:
      type: object
      required: [name, clinicalStatus, diagnosisDate]
      properties:
        name: { type: string }
        clinicalStatus: { type: string, enum: [ACTIVE, PAST] }
        diagnosisDate: { type: string, format: date }
        supersedesEntryId: { type: string, format: uuid, nullable: true }

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
